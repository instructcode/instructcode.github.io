<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>ROOT ACCESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000}
  body{
    font-family:'Share Tech Mono',ui-monospace,'SF Mono',Menlo,monospace;
    color:#3bff5c;
    display:flex;align-items:center;justify-content:center;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    position:relative;
  }

  /* ---- layers ---- */
  #rain{position:fixed;inset:0;z-index:0;display:block}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.92) 100%);
  }
  .scanlines{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(180deg,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.5) 3px, rgba(0,0,0,.5) 4px);
  }
  .sweep{
    position:fixed;left:0;right:0;height:180px;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(59,255,92,0) 0%,rgba(59,255,92,.05) 50%,rgba(59,255,92,0) 100%);
    animation:sweep 7s linear infinite;
  }
  @keyframes sweep{0%{top:-200px}100%{top:100%}}

  /* ---- shell ---- */
  .shell{
    position:relative;z-index:4;width:100%;max-width:760px;
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:1} 41%{opacity:1} 42%{opacity:.82}
    43%{opacity:1} 77%{opacity:1} 78%{opacity:.88} 79%{opacity:1}
  }

  /* ---- boot ---- */
  #boot{
    font-size:13px;line-height:1.75;color:#1f9e38;
    min-height:96px;letter-spacing:.5px;
    text-shadow:0 0 8px rgba(59,255,92,.35);
  }
  #boot .ok{color:#3bff5c}
  .caret{display:inline-block;width:8px;height:14px;background:#3bff5c;
    vertical-align:-2px;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px #3bff5c}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  /* ---- title ---- */
  .head{margin:26px 0 30px;opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
  .head.in{opacity:1;transform:none}
  h1{
    font-size:clamp(30px,9vw,62px);font-weight:400;letter-spacing:.16em;
    color:#8dffa2;line-height:1;position:relative;
    text-shadow:0 0 6px rgba(59,255,92,.9),0 0 26px rgba(59,255,92,.45),0 0 60px rgba(59,255,92,.2);
  }
  h1::before,h1::after{
    content:attr(data-t);position:absolute;left:0;top:0;width:100%;
    clip-path:inset(0 0 0 0);pointer-events:none;
  }
  h1::before{color:#00fff2;animation:g1 4.2s infinite steps(1)}
  h1::after{color:#ff0059;animation:g2 5.7s infinite steps(1)}
  @keyframes g1{
    0%,95%,100%{transform:none;clip-path:inset(100% 0 0 0)}
    96%{transform:translate(-3px,-1px);clip-path:inset(12% 0 62% 0)}
    97%{transform:translate(2px,1px);clip-path:inset(58% 0 22% 0)}
    98%{transform:translate(-2px,0);clip-path:inset(30% 0 45% 0)}
  }
  @keyframes g2{
    0%,93%,100%{transform:none;clip-path:inset(100% 0 0 0)}
    94%{transform:translate(3px,1px);clip-path:inset(70% 0 8% 0)}
    95%{transform:translate(-3px,-2px);clip-path:inset(20% 0 55% 0)}
  }
  .sub{
    margin-top:12px;font-size:12px;letter-spacing:.42em;color:#1f9e38;
    text-transform:uppercase;
  }

  /* ---- portals ---- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .portal{
    position:relative;display:block;text-decoration:none;color:inherit;
    padding:26px 22px 22px;background:rgba(0,24,6,.55);
    border:1px solid rgba(59,255,92,.32);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;transform:translateY(18px);
    transition:background .25s,border-color .25s,box-shadow .25s,transform .25s;
    overflow:hidden;
  }
  .portal.in{opacity:1;transform:none;transition:opacity .7s ease,transform .7s ease}
  .portal::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(59,255,92,.09),rgba(59,255,92,0) 55%);
  }
  .portal:hover,.portal:active,.portal:focus-visible{
    background:rgba(0,48,12,.72);border-color:#3bff5c;
    box-shadow:0 0 0 1px rgba(59,255,92,.5),0 0 34px rgba(59,255,92,.35),inset 0 0 34px rgba(59,255,92,.12);
    transform:translateY(-3px);outline:none;
  }
  .corner{position:absolute;width:12px;height:12px;border:1px solid #3bff5c;opacity:.85}
  .c1{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .c2{top:-1px;right:-1px;border-left:0;border-bottom:0}
  .c3{bottom:-1px;left:-1px;border-right:0;border-top:0}
  .c4{bottom:-1px;right:-1px;border-left:0;border-top:0}

  .tag{font-size:10px;letter-spacing:.34em;color:#1f9e38;margin-bottom:14px}
  .glyph{font-size:34px;line-height:1;color:#8dffa2;
    text-shadow:0 0 12px rgba(59,255,92,.8);margin-bottom:12px}
  .portal h2{font-size:21px;font-weight:400;letter-spacing:.12em;color:#c9ffd4;margin-bottom:6px}
  .portal p{font-size:12px;line-height:1.6;color:#2fbe4c}
  .enter{
    margin-top:18px;font-size:11px;letter-spacing:.26em;color:#3bff5c;
    display:flex;align-items:center;gap:8px;
  }
  .enter .bar{flex:1;height:1px;background:linear-gradient(90deg,rgba(59,255,92,.55),rgba(59,255,92,0))}

  .foot{
    margin-top:26px;font-size:10px;letter-spacing:.3em;color:#166b26;
    display:flex;justify-content:space-between;opacity:0;transition:opacity .8s ease .2s
  }
  .foot.in{opacity:1}

  @media(max-width:560px){
    .grid{grid-template-columns:1fr;gap:14px}
    .portal{padding:20px 18px}
    .glyph{font-size:28px}
    #boot{font-size:11px;min-height:80px}
    .foot{font-size:9px;letter-spacing:.2em}
  }
  @media(prefers-reduced-motion:reduce){
    .shell,.sweep,h1::before,h1::after{animation:none!important}
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="sweep"></div>

<div class="shell">

  <div id="boot"></div>

  <div class="head" id="head">
    <h1 data-t="THE ARCHIVE">THE ARCHIVE</h1>
    <div class="sub">select a construct</div>
  </div>

  <div class="grid">
    <a class="portal" href="./comedy/" id="p1">
      <span class="corner c1"></span><span class="corner c2"></span>
      <span class="corner c3"></span><span class="corner c4"></span>
      <div class="tag">// NODE 01</div>
      <div class="glyph">笑</div>
      <h2>COMEDY</h2>
      <p>Bits, premises, tags. Orbital joke architecture.</p>
      <div class="enter"><span>ENTER</span><span class="bar"></span><span>&gt;&gt;</span></div>
    </a>

    <a class="portal" href="./bibleapp/" id="p2">
      <span class="corner c1"></span><span class="corner c2"></span>
      <span class="corner c3"></span><span class="corner c4"></span>
      <div class="tag">// NODE 02</div>
      <div class="glyph">聖</div>
      <h2>SCRIPTURE</h2>
      <p>Verses, threads, study. Orbital canon mapping.</p>
      <div class="enter"><span>ENTER</span><span class="bar"></span><span>&gt;&gt;</span></div>
    </a>
  </div>

  <div class="foot" id="foot">
    <span>SYS://ROOT</span>
    <span id="clock">--:--:--</span>
  </div>

</div>

<script>
(function(){
  /* ================= MATRIX RAIN ================= */
  var cv = document.getElementById('rain');
  var ctx = cv.getContext('2d', {alpha:false});
  var GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFZ:.=*+-<>¦｜'.split('');
  var W=0,H=0,cols=0,size=0,drops=[],speeds=[],dpr=1;

  function build(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    size = W < 560 ? 13 : 16;
    cols = Math.ceil(W/size);
    drops = new Array(cols);
    speeds = new Array(cols);
    for(var i=0;i<cols;i++){
      drops[i] = Math.random()*-60;
      speeds[i] = 0.45 + Math.random()*0.85;
    }
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);
  }

  function frame(){
    ctx.fillStyle = 'rgba(0,0,0,0.075)';
    ctx.fillRect(0,0,W,H);
    ctx.font = size + "px 'Share Tech Mono', monospace";
    ctx.textBaseline = 'top';

    for(var i=0;i<cols;i++){
      var ch = GLYPHS[(Math.random()*GLYPHS.length)|0];
      var x = i*size;
      var y = drops[i]*size;

      if(y > -size && y < H+size){
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#3bff5c';
        ctx.fillStyle = '#d9ffe2';
        ctx.fillText(ch, x, y);
        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(59,255,92,0.55)';
        ctx.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0], x, y - size);
        ctx.fillStyle = 'rgba(31,158,56,0.35)';
        ctx.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0], x, y - size*2);
      }

      drops[i] += speeds[i];
      if(y > H && Math.random() > 0.975){
        drops[i] = Math.random()*-40;
        speeds[i] = 0.45 + Math.random()*0.85;
      }
    }
    requestAnimationFrame(frame);
  }

  build();
  requestAnimationFrame(frame);

  /* iOS Safari: URL bar collapse fires resize with only a height delta.
     Only rebuild on a real width change or a large height change. */
  var lastW = window.innerWidth, lastH = window.innerHeight, rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      var w = window.innerWidth, h = window.innerHeight;
      if(w !== lastW || Math.abs(h - lastH) > 140){
        lastW = w; lastH = h;
        build();
      }
    }, 220);
  });

  /* ================= BOOT SEQUENCE ================= */
  var LINES = [
    'initializing neural link ....... <s class="ok">OK</s>',
    'mounting /dev/constructs ....... <s class="ok">OK</s>',
    'decrypting archive keys ........ <s class="ok">OK</s>',
    'wake up. two nodes online.'
  ];
  var boot = document.getElementById('boot');
  var li = 0, ci = 0, done = false;
  var buf = '';

  function reveal(){
    if(done) return;
    done = true;
    boot.innerHTML = LINES.join('<br>').replace(/<s /g,'<span ').replace(/<\/s>/g,'</span>')
      + '<span class="caret"></span>';
    document.getElementById('head').classList.add('in');
    setTimeout(function(){ document.getElementById('p1').classList.add('in'); }, 180);
    setTimeout(function(){ document.getElementById('p2').classList.add('in'); }, 340);
    setTimeout(function(){ document.getElementById('foot').classList.add('in'); }, 520);
  }

  function type(){
    if(done) return;
    if(li >= LINES.length){ reveal(); return; }
    var line = LINES[li];
    if(ci < line.length){
      // jump over html tags in one tick so they never render as text
      if(line[ci] === '<'){ ci = line.indexOf('>', ci) + 1; }
      else { ci++; }
      buf = LINES.slice(0,li).join('<br>') + (li?'<br>':'') + line.slice(0,ci);
      boot.innerHTML = buf.replace(/<s /g,'<span ').replace(/<\/s>/g,'</span>') + '<span class="caret"></span>';
      setTimeout(type, 14);
    } else {
      li++; ci = 0;
      setTimeout(type, 130);
    }
  }
  setTimeout(type, 260);

  // tap or key to skip the boot
  document.addEventListener('touchend', reveal, {passive:true});
  document.addEventListener('click', reveal);
  document.addEventListener('keydown', reveal);
  setTimeout(reveal, 4200);

  /* ================= CLOCK ================= */
  var clock = document.getElementById('clock');
  function tick(){
    var d = new Date(), p = function(n){ return n<10?'0'+n:''+n; };
    clock.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
