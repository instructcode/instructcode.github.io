<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>THE LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#000}
  body{
    min-height:100vh;min-height:100dvh;background:#000;color:#a8d9b5;
    font-family:'Share Tech Mono',ui-monospace,'SF Mono',Menlo,monospace;
    -webkit-overflow-scrolling:touch;overflow-x:hidden;
    padding:calc(18px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
  }
  #rain{position:fixed;inset:0;z-index:0;opacity:.24;display:block}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,0) 20%,rgba(0,0,0,.7) 75%,rgba(0,0,0,.95) 100%)}
  .wrap{position:relative;z-index:2;max-width:760px;margin:0 auto}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;
    padding-bottom:14px;border-bottom:1px solid rgba(59,255,92,.22);margin-bottom:26px}
  .brand{font-size:17px;letter-spacing:.24em;color:#8dffa2;text-decoration:none;
    text-shadow:0 0 12px rgba(59,255,92,.5);white-space:nowrap}
  .spacer{flex:1}
  .chip{
    font-size:10px;letter-spacing:.2em;padding:7px 11px;cursor:pointer;
    border:1px solid rgba(59,255,92,.3);background:rgba(0,20,5,.6);color:#2fbe4c;
    transition:.2s;white-space:nowrap;font-family:inherit
  }
  .chip:hover,.chip:active{border-color:#3bff5c;color:#c9ffd4;box-shadow:0 0 16px rgba(59,255,92,.28)}
  .chip.on{border-color:#3bff5c;color:#3bff5c}
  .chip.danger:hover{border-color:#ff4d6a;color:#ff9db0;box-shadow:0 0 16px rgba(255,77,106,.28)}

  .detbtn{
    width:30px;height:30px;flex:0 0 30px;padding:0;cursor:pointer;
    border:1px solid rgba(255,77,106,.35);background:rgba(30,0,4,.5);
    color:#ff6b81;display:flex;align-items:center;justify-content:center;
    transition:.2s;
  }
  .detbtn svg{width:16px;height:16px;display:block}
  .detbtn:hover,.detbtn:active{
    border-color:#ff4d6a;color:#ffb8c4;background:rgba(60,0,8,.65);
    box-shadow:0 0 14px rgba(255,77,106,.35);
  }
  .detbtn:disabled{opacity:.35;cursor:default;box-shadow:none}

  /* ---------- auth panel ---------- */
  #auth{display:none;margin-bottom:26px;padding:18px;
    border:1px solid rgba(59,255,92,.28);background:rgba(0,18,4,.75)}
  #auth.show{display:block}
  #auth h3{font-size:12px;letter-spacing:.24em;color:#8dffa2;font-weight:400;margin-bottom:10px}
  #auth p{font-size:12px;line-height:1.7;color:#2a9b41;margin-bottom:12px}
  #auth a{color:#3bff5c}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,textarea,select{
    font-family:inherit;font-size:16px;color:#c9ffd4;background:rgba(0,0,0,.55);
    border:1px solid rgba(59,255,92,.3);padding:11px 12px;width:100%;
    border-radius:0;-webkit-appearance:none;outline:none
  }
  input:focus,textarea:focus{border-color:#3bff5c;box-shadow:0 0 0 1px rgba(59,255,92,.35)}
  ::placeholder{color:#1c6b2c}

  /* ---------- list ---------- */
  .post-link{
    display:block;text-decoration:none;color:inherit;padding:18px 0;
    border-bottom:1px solid rgba(59,255,92,.14);transition:.2s
  }
  .post-link:hover{background:rgba(59,255,92,.04);padding-left:8px}
  .meta{font-size:11px;letter-spacing:.2em;color:#1f8f34;margin-bottom:7px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .post-link h2{font-size:21px;font-weight:400;color:#c9ffd4;letter-spacing:.02em;
    line-height:1.35;margin-bottom:7px}
  .excerpt{font-size:14px;line-height:1.65;color:#5aa76c}
  .badge{border:1px solid rgba(255,190,60,.45);color:#ffbe3c;padding:2px 7px;font-size:9px;letter-spacing:.16em}
  .tagpill{border:1px solid rgba(59,255,92,.25);padding:2px 7px;font-size:9px;letter-spacing:.14em;color:#2a9b41}

  .empty{padding:50px 0;text-align:center;color:#1f8f34;font-size:13px;line-height:1.9}

  /* ---------- article ---------- */
  article{padding-top:4px}
  article h1{font-size:clamp(25px,6vw,38px);font-weight:400;color:#d8ffe2;
    line-height:1.2;letter-spacing:.01em;margin-bottom:14px;
    text-shadow:0 0 20px rgba(59,255,92,.28)}
  .body{font-size:16.5px;line-height:1.85;color:#bfe4c9;margin-top:26px}
  .body p{margin:0 0 1.25em}
  .body h2{font-size:21px;color:#8dffa2;font-weight:400;margin:1.9em 0 .7em;letter-spacing:.04em}
  .body h3{font-size:17px;color:#8dffa2;font-weight:400;margin:1.6em 0 .6em;letter-spacing:.04em}
  .body a{color:#3bff5c;text-decoration:underline;text-underline-offset:3px}
  .body strong{color:#e6fff0}
  .body em{color:#9fd9ad}
  .body ul,.body ol{margin:0 0 1.25em 1.3em}
  .body li{margin-bottom:.5em}
  .body blockquote{border-left:2px solid rgba(59,255,92,.4);padding:2px 0 2px 16px;
    margin:0 0 1.25em;color:#7fc492}
  .body code{background:rgba(59,255,92,.1);padding:2px 6px;font-size:14px;color:#a8ffbe}
  .body pre{background:rgba(0,25,7,.8);border:1px solid rgba(59,255,92,.2);
    padding:14px;overflow-x:auto;margin:0 0 1.25em}
  .body pre code{background:none;padding:0;font-size:13.5px;line-height:1.6}
  .body img{max-width:100%;height:auto;border:1px solid rgba(59,255,92,.2);margin-bottom:1.25em}
  .body hr{border:0;border-top:1px solid rgba(59,255,92,.22);margin:2.2em 0}

  /* ---------- editor ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;letter-spacing:.24em;color:#1f8f34;margin-bottom:6px}
  #ed-body{min-height:46vh;line-height:1.7;resize:vertical}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px solid rgba(59,255,92,.16)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:600px){.split{grid-template-columns:1fr}}
  .check{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;color:#2fbe4c;cursor:pointer}
  .check input{width:auto;margin:0}

  #status{font-size:12px;line-height:1.7;margin-top:14px;min-height:20px;letter-spacing:.06em}
  .ok{color:#3bff5c}.err{color:#ff6b81}.warn{color:#ffbe3c}.dim{color:#1f8f34}

  /* Impact tear — the landing page's headline glitch, applied to the
     whole shell. steps() keyframes on purpose: the effect snaps between
     states rather than easing, which is what makes it read as static
     rather than as an animation. */
  @keyframes uiTear{
    0%   {transform:translateX(0);   text-shadow:none}
    12%  {transform:translateX(-3px);text-shadow:2px 0 rgba(255,0,89,.95),-2px 0 rgba(0,255,242,.8)}
    24%  {transform:translateX(2px); text-shadow:-3px 0 rgba(255,0,89,.9),3px 0 rgba(0,255,242,.7)}
    36%  {transform:translateX(0);   text-shadow:none}
    52%  {transform:translateX(4px); text-shadow:-2px 0 rgba(255,0,89,.95),2px 0 rgba(0,255,242,.8)}
    64%  {transform:translateX(-2px);text-shadow:3px 0 rgba(255,0,89,.8),-3px 0 rgba(0,255,242,.6)}
    76%  {transform:translateX(0);   text-shadow:none}
    88%  {transform:translateX(-4px);text-shadow:2px 0 rgba(255,0,89,.9),-2px 0 rgba(0,255,242,.75)}
    100% {transform:translateX(0);   text-shadow:none}
  }
  @keyframes uiScan{
    0%,100%{opacity:0}
    10%{opacity:.5} 22%{opacity:0} 48%{opacity:.62} 60%{opacity:0} 86%{opacity:.38}
  }
  .wrap.tear{animation:uiTear .30s steps(1) infinite}
  .wrap.tear .brand,.wrap.tear h1,.wrap.tear h2{color:#ffd9e2}

  #tearlayer{
    position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
    background:
      repeating-linear-gradient(180deg,
        rgba(255,0,89,.16) 0px, rgba(255,0,89,.16) 2px,
        rgba(0,0,0,0) 3px, rgba(0,0,0,0) 7px),
      linear-gradient(180deg, rgba(255,0,89,.10), rgba(0,255,242,.07));
    mix-blend-mode:screen;
  }
  #tearlayer.on{animation:uiScan .26s steps(1) infinite}

  .hidden{display:none!important}
  .backlink{display:inline-block;font-size:11px;letter-spacing:.2em;color:#2a9b41;
    text-decoration:none;margin-bottom:22px}
  .backlink:hover{color:#3bff5c}
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="vig"></div>
<div id="tearlayer"></div>

<div class="wrap">

  <header>
    <a class="brand" href="#/">THE LOG</a>
    <button class="detbtn" id="btn-detonate" title="detonate" aria-label="detonate the scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.6c.9 1.7.6 2.9-.4 4 1.7-.3 2.7.2 3.4 1.5.9-1 2.1-1.1 3.3-.5-.6 1.5-.3 2.6.9 3.4-1.7.2-2.5 1.1-2.6 2.6 1.3-.6 2.4-.3 3.3.6-1.1 1.1-2.4 1.2-3.7.4.4 1.6-.1 2.7-1.4 3.5-.6-1.4-1.6-1.9-3-1.6.6 1.5.1 2.7-1.2 3.6-.9-1.2-.9-2.4-.1-3.7-1.5.5-2.7 0-3.5-1.3 1.4-.6 1.9-1.6 1.5-3-1.4.6-2.6.1-3.4-1.2 1.2-.8 2.4-.8 3.6 0-.4-1.5.1-2.6 1.4-3.4-.5 1.4 0 2.5 1.3 3.1-.5-1.5 0-2.7 1.3-3.5-.9-1.2-.8-2.4.1-3.5z"/>
        <circle cx="12" cy="12" r="2.1"/>
      </svg>
    </button>
    <span class="spacer"></span>
    <button class="chip hidden" id="btn-new">+ NEW</button>
    <button class="chip" id="btn-auth">[ LOCKED ]</button>
  </header>

  <div id="auth">
    <h3>ROOT AUTHENTICATION</h3>
    <p>
      Paste a GitHub fine-grained personal access token with
      <strong>Contents: Read and write</strong> on this repository only.
      It is stored in this browser's localStorage and never leaves your device
      except in requests to api.github.com.
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create one &rarr;</a>
    </p>
    <div class="split">
      <div class="field">
        <label>GITHUB USERNAME</label>
        <input id="cfg-owner" placeholder="your-username" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label>REPOSITORY</label>
        <input id="cfg-repo" placeholder="your-repo" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <div class="split">
      <div class="field">
        <label>BRANCH</label>
        <input id="cfg-branch" placeholder="main" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label>POSTS PATH IN REPO</label>
        <input id="cfg-dir" placeholder="blog/posts" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <div class="field">
      <label>TOKEN</label>
      <input type="password" id="tok" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="row">
      <button class="chip" id="btn-save-tok">AUTHENTICATE</button>
      <button class="chip danger" id="btn-clear-tok">SIGN OUT</button>
    </div>
    <div id="auth-status"></div>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list"></div>

  <!-- POST VIEW -->
  <div id="view-post" class="hidden"></div>

  <!-- EDITOR VIEW -->
  <div id="view-edit" class="hidden">
    <a class="backlink" href="#/">&lt;&lt; BACK TO INDEX</a>

    <div class="toolbar">
      <button class="chip on" id="tab-write">WRITE</button>
      <button class="chip" id="tab-preview">PREVIEW</button>
      <span class="spacer"></span>
      <button class="chip" id="btn-publish">PUBLISH</button>
      <button class="chip danger hidden" id="btn-delete">DELETE</button>
    </div>

    <div id="pane-write">
      <div class="field">
        <label>TITLE</label>
        <input id="ed-title" placeholder="Untitled transmission" autocapitalize="sentences">
      </div>

      <div class="split">
        <div class="field">
          <label>SLUG (URL)</label>
          <input id="ed-slug" placeholder="auto-generated" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label>DATE</label>
          <input id="ed-date" type="date">
        </div>
      </div>

      <div class="field">
        <label>TAGS (comma separated)</label>
        <input id="ed-tags" placeholder="comedy, notes" autocapitalize="off">
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="ed-draft">
          <span>DRAFT — hidden from the public index</span>
        </label>
      </div>

      <div class="field">
        <label>BODY (markdown)</label>
        <textarea id="ed-body" placeholder="# Heading&#10;&#10;Write here. **bold**, *italic*, [link](url), - lists, &gt; quotes."></textarea>
      </div>
    </div>

    <div id="pane-preview" class="hidden">
      <article><h1 id="pv-title"></h1><div class="body" id="pv-body"></div></article>
    </div>

    <div id="status"></div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG — set these three to match your repo
   ============================================================ */
var CFG = {
  owner:  'YOUR_GITHUB_USERNAME',
  repo:   'YOUR_REPO_NAME',
  branch: 'main',
  dir:    'blog/posts'        // path inside the repo
};

var TOK_KEY   = 'log_gh_token';
var CFG_KEY   = 'log_gh_cfg';
var DRAFT_KEY = 'log_editor_draft';

/* Repo settings are stored in the browser and editable from the panel.
   Editing CFG above means hand-editing this file, which is miserable on
   a phone — and leaving the placeholders in place makes every API call
   404, which used to surface as a confusing permissions error. */
(function loadCfg(){
  try{
    var saved = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
    if(saved){
      if(saved.owner)  CFG.owner  = saved.owner;
      if(saved.repo)   CFG.repo   = saved.repo;
      if(saved.branch) CFG.branch = saved.branch;
      if(saved.dir)    CFG.dir    = saved.dir;
    }
  }catch(e){}
})();

function cfgPlaceholder(){
  return /^YOUR_/.test(CFG.owner) || /^YOUR_/.test(CFG.repo) || !CFG.owner || !CFG.repo;
}

var TOKEN = localStorage.getItem(TOK_KEY) || '';
var MANIFEST = null;          // [{slug,title,date,tags,draft,excerpt}]
var EDITING = null;           // slug currently being edited, or null for new

/* ============================================================
   UTF-8 SAFE BASE64
   btoa() throws on any character above U+00FF. Smart quotes,
   em dashes and emoji all land there, so encode through
   TextEncoder and chunk the byte array — String.fromCharCode
   blows the call stack past roughly 100k arguments.
   ============================================================ */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
  for(var i=0;i<bytes.length;i+=CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(String(b64).replace(/\s/g,''));
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ============================================================
   GITHUB API
   ============================================================ */
function gh(path, opts){
  opts = opts || {};
  var h = {
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  };
  if(TOKEN) h.Authorization = 'Bearer ' + TOKEN;
  if(opts.body) h['Content-Type'] = 'application/json';

  return fetch('https://api.github.com' + path, {
    method: opts.method || 'GET',
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store'
  }).then(function(res){
    if(res.status === 404){
      if(opts.strict404){
        throw new Error('Not found (404): no repo "' + CFG.owner + '/' + CFG.repo +
          '" visible to this token. Check the username and repository above, and make sure ' +
          'the token grants access to that specific repo.');
      }
      return {__missing:true, __status:404};
    }
    return res.json().then(function(j){
      if(!res.ok){
        var msg = (j && j.message) || ('HTTP ' + res.status);
        if(res.status === 401) msg = 'Token rejected (401). It may be expired or lack Contents write access.';
        if(res.status === 403) msg = 'Forbidden (403). Check the token has Contents: Read and write on this repo.';
        if(res.status === 409) msg = 'Conflict (409). The file changed on GitHub — reload and retry.';
        throw new Error(msg);
      }
      return j;
    });
  });
}

function repoPath(file){
  return '/repos/' + CFG.owner + '/' + CFG.repo + '/contents/' + CFG.dir + '/' + file;
}

// Read a file, returning {text, sha} or null when it does not exist.
function readFile(file){
  return gh(repoPath(file) + '?ref=' + encodeURIComponent(CFG.branch)).then(function(j){
    if(j.__missing) return null;
    return { text: b64dec(j.content), sha: j.sha };
  });
}

// Write a file. Re-reads the sha immediately before the PUT so a
// stale sha from earlier in the session cannot cause a 409.
function writeFile(file, text, message){
  return readFile(file).then(function(cur){
    var body = {
      message: message,
      content: b64enc(text),
      branch: CFG.branch
    };
    if(cur) body.sha = cur.sha;
    return gh(repoPath(file), {method:'PUT', body:body});
  });
}

function deleteFile(file, message){
  return readFile(file).then(function(cur){
    if(!cur) return null;
    return gh(repoPath(file), {method:'DELETE', body:{
      message: message, sha: cur.sha, branch: CFG.branch
    }});
  });
}

/* ============================================================
   FRONT MATTER
   ============================================================ */
function buildPost(m, body){
  return '---\n'
    + 'title: '  + m.title + '\n'
    + 'date: '   + m.date + '\n'
    + 'tags: '   + (m.tags || []).join(', ') + '\n'
    + 'draft: '  + (m.draft ? 'true' : 'false') + '\n'
    + '---\n\n' + body;
}

function parsePost(raw){
  var out = {title:'Untitled', date:'', tags:[], draft:false, body:raw};
  var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(raw);
  if(!m) return out;
  out.body = raw.slice(m[0].length).replace(/^\s*\n/, '');
  m[1].split(/\r?\n/).forEach(function(line){
    var i = line.indexOf(':');
    if(i < 0) return;
    var k = line.slice(0,i).trim().toLowerCase();
    var v = line.slice(i+1).trim();
    if(k === 'title') out.title = v;
    else if(k === 'date') out.date = v;
    else if(k === 'draft') out.draft = (v === 'true');
    else if(k === 'tags') out.tags = v ? v.split(',').map(function(s){return s.trim();}).filter(Boolean) : [];
  });
  return out;
}

/* ============================================================
   MARKDOWN  (compact, no dependencies)
   ============================================================ */
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inline(s){
  return s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

function md(src){
  if(!src) return '';
  src = esc(src.replace(/\r\n/g,'\n'));

  // pull fenced code out before anything else touches it
  var blocks = [];
  src = src.replace(/```[a-z]*\n([\s\S]*?)```/g, function(_, code){
    blocks.push(code.replace(/\n$/,''));
    return '\u0000CODE' + (blocks.length-1) + '\u0000';
  });

  var lines = src.split('\n'), out = [], para = [], list = null;

  function flushPara(){
    if(para.length){ out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
  }
  function flushList(){
    if(list){ out.push('<' + list.tag + '>' + list.items.join('') + '</' + list.tag + '>'); list = null; }
  }
  function flushAll(){ flushPara(); flushList(); }

  for(var i=0;i<lines.length;i++){
    var L = lines[i], t = L.trim();

    if(!t){ flushAll(); continue; }

    var code = /^\u0000CODE(\d+)\u0000$/.exec(t);
    if(code){ flushAll(); out.push('<pre><code>' + blocks[+code[1]] + '</code></pre>'); continue; }

    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flushAll(); out.push('<hr>'); continue; }

    var h = /^(#{1,4})\s+(.*)$/.exec(t);
    if(h){ flushAll(); var lv = Math.min(h[1].length + 1, 4);
      out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); continue; }

    if(/^&gt;\s?/.test(t)){ flushAll();
      out.push('<blockquote>' + inline(t.replace(/^&gt;\s?/,'')) + '</blockquote>'); continue; }

    var ul = /^[-*+]\s+(.*)$/.exec(t);
    var ol = /^\d+[.)]\s+(.*)$/.exec(t);
    if(ul || ol){
      var tag = ul ? 'ul' : 'ol';
      flushPara();
      if(!list || list.tag !== tag){ flushList(); list = {tag:tag, items:[]}; }
      list.items.push('<li>' + inline((ul||ol)[1]) + '</li>');
      continue;
    }

    flushList();
    para.push(t);
  }
  flushAll();
  return out.join('\n');
}

function excerptOf(body, n){
  var plain = body
    .replace(/```[\s\S]*?```/g,'')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/[#>*`_-]/g,'')
    .replace(/\s+/g,' ')
    .trim();
  n = n || 165;
  return plain.length > n ? plain.slice(0,n).replace(/\s\S*$/,'') + '…' : plain;
}

/* ============================================================
   MANIFEST
   Logged out: read the published file over HTTP (no rate limit).
   Logged in:  read through the API so a fresh publish shows up
               immediately instead of waiting on the Pages rebuild.
   ============================================================ */
function loadManifest(){
  if(TOKEN){
    return readFile('index.json')
      .then(function(f){ return f ? JSON.parse(f.text) : []; })
      .catch(function(){ return fetchManifestHttp(); });
  }
  return fetchManifestHttp();
}
function fetchManifestHttp(){
  return fetch('posts/index.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : []; })
    .catch(function(){ return []; });
}

function loadPostBody(slug){
  if(TOKEN){
    return readFile(slug + '.md').then(function(f){
      if(f) return f.text;
      return fetchPostHttp(slug);
    }).catch(function(){ return fetchPostHttp(slug); });
  }
  return fetchPostHttp(slug);
}
function fetchPostHttp(slug){
  return fetch('posts/' + slug + '.md?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('Post not found'); return r.text(); });
}

/* ============================================================
   DOM HELPERS
   ============================================================ */
function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function say(el, msg, cls){ $(el).innerHTML = '<span class="' + (cls||'dim') + '">' + msg + '</span>'; }

function slugify(s){
  return s.toLowerCase().trim()
    .replace(/['’"]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,70);
}
function today(){
  var d = new Date(), p = function(n){ return n<10?'0'+n:''+n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function prettyDate(iso){
  if(!iso) return '';
  var p = iso.split('-');
  if(p.length !== 3) return iso;
  var M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return M[+p[1]-1] + ' ' + (+p[2]) + ' ' + p[0];
}

function fillCfgFields(){
  $('cfg-owner').value  = /^YOUR_/.test(CFG.owner) ? '' : CFG.owner;
  $('cfg-repo').value   = /^YOUR_/.test(CFG.repo)  ? '' : CFG.repo;
  $('cfg-branch').value = CFG.branch || 'main';
  $('cfg-dir').value    = CFG.dir || 'blog/posts';
}

$('btn-auth').onclick = function(){
  $('auth').classList.toggle('show');
  if($('auth').classList.contains('show')) fillCfgFields();
};

$('btn-save-tok').onclick = function(){
  var owner  = $('cfg-owner').value.trim().replace(/^@/,'');
  var repo   = $('cfg-repo').value.trim();
  var branch = $('cfg-branch').value.trim() || 'main';
  var dir    = $('cfg-dir').value.trim().replace(/^\/+|\/+$/g,'') || 'blog/posts';
  var v      = $('tok').value.trim();

  // a pasted repo URL or "user/repo" is the obvious thing to type here,
  // so accept both rather than rejecting them
  var m = /(?:github\.com\/)?([^\/\s]+)\/([^\/\s]+?)(?:\.git)?$/.exec(repo);
  if(m && m[1] && m[2]){ owner = owner || m[1]; repo = m[2]; }

  if(!owner || !repo){ say('auth-status','Enter your GitHub username and repository.','err'); return; }
  if(!v){ say('auth-status','Paste a token as well.','err'); return; }

  var prevCfg = {owner:CFG.owner, repo:CFG.repo, branch:CFG.branch, dir:CFG.dir};
  var prevTok = TOKEN;
  CFG.owner = owner; CFG.repo = repo; CFG.branch = branch; CFG.dir = dir;
  TOKEN = v;

  say('auth-status','Verifying…','dim');

  gh('/repos/' + CFG.owner + '/' + CFG.repo, {strict404:true}).then(function(r){
    if(!r.permissions || !r.permissions.push){
      throw new Error('Signed in, but this token has no write access to ' + r.full_name +
        '. The token needs Contents: Read and write on that repository.');
    }
    // confirm the branch exists, so a typo fails here and not mid-publish
    return gh('/repos/' + CFG.owner + '/' + CFG.repo + '/branches/' +
              encodeURIComponent(CFG.branch), {strict404:true})
      .then(function(){ return r; })
      .catch(function(){
        throw new Error('Repo is fine, but branch "' + CFG.branch + '" was not found. ' +
          'Most repos use "main" or "master".');
      });
  }).then(function(r){
    localStorage.setItem(TOK_KEY, v);
    localStorage.setItem(CFG_KEY, JSON.stringify({
      owner:CFG.owner, repo:CFG.repo, branch:CFG.branch, dir:CFG.dir
    }));
    $('tok').value = '';
    refreshAuthUI();
    say('auth-status','Authenticated on ' + r.full_name + ' (' + CFG.branch +
        '). Write access confirmed — tap + NEW to start writing.','ok');
    route();
  }).catch(function(e){
    TOKEN = prevTok;
    CFG.owner = prevCfg.owner; CFG.repo = prevCfg.repo;
    CFG.branch = prevCfg.branch; CFG.dir = prevCfg.dir;
    say('auth-status', esc(e.message), 'err');
  });
};

$('btn-clear-tok').onclick = function(){
  TOKEN = '';
  localStorage.removeItem(TOK_KEY);
  refreshAuthUI();
  say('auth-status','Signed out. Repo settings kept.','warn');
  route();
};

$('btn-new').onclick = function(){ location.hash = '#/new'; };

   VIEWS
   ============================================================ */
function renderList(){
  var el = $('view-list');
  el.innerHTML = '<div class="empty">reading index…</div>';

  loadManifest().then(function(list){
    MANIFEST = Array.isArray(list) ? list : [];
    var visible = MANIFEST.filter(function(p){ return TOKEN || !p.draft; });
    visible.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

    if(!visible.length){
      el.innerHTML = '<div class="empty">no transmissions yet.' +
        (TOKEN ? '<br>tap + NEW to write the first one.' : '<br>check back soon.') + '</div>';
      return;
    }

    el.innerHTML = visible.map(function(p){
      var tags = (p.tags||[]).map(function(t){ return '<span class="tagpill">' + esc(t) + '</span>'; }).join('');
      return '<a class="post-link" href="#/p/' + encodeURIComponent(p.slug) + '">' +
        '<div class="meta">' +
          '<span>' + prettyDate(p.date) + '</span>' +
          (p.draft ? '<span class="badge">DRAFT</span>' : '') + tags +
        '</div>' +
        '<h2>' + esc(p.title || 'Untitled') + '</h2>' +
        (p.excerpt ? '<div class="excerpt">' + esc(p.excerpt) + '</div>' : '') +
      '</a>';
    }).join('');
  });
}

function renderPost(slug){
  var el = $('view-post');
  el.innerHTML = '<div class="empty">decrypting…</div>';

  loadPostBody(slug).then(function(raw){
    var p = parsePost(raw);
    var tags = (p.tags||[]).map(function(t){ return '<span class="tagpill">' + esc(t) + '</span>'; }).join('');
    el.innerHTML =
      '<a class="backlink" href="#/">&lt;&lt; BACK TO INDEX</a>' +
      '<article>' +
        '<div class="meta">' +
          '<span>' + prettyDate(p.date) + '</span>' +
          (p.draft ? '<span class="badge">DRAFT</span>' : '') + tags +
          (TOKEN ? '<a class="chip" style="text-decoration:none" href="#/edit/' + encodeURIComponent(slug) + '">EDIT</a>' : '') +
        '</div>' +
        '<h1>' + esc(p.title) + '</h1>' +
        '<div class="body">' + md(p.body) + '</div>' +
      '</article>';
    window.scrollTo(0,0);
  }).catch(function(e){
    el.innerHTML = '<a class="backlink" href="#/">&lt;&lt; BACK TO INDEX</a>' +
      '<div class="empty"><span class="err">' + esc(e.message) + '</span></div>';
  });
}

/* ---------- editor ---------- */
var slugTouched = false;
$('ed-slug').addEventListener('input', function(){ slugTouched = true; });
$('ed-title').addEventListener('input', function(){
  if(!slugTouched && !EDITING) $('ed-slug').value = slugify(this.value);
  saveDraft();
});
['ed-slug','ed-date','ed-tags','ed-body'].forEach(function(id){
  $(id).addEventListener('input', saveDraft);
});
$('ed-draft').addEventListener('change', saveDraft);

var draftTimer = null;
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function(){
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        editing: EDITING,
        title: $('ed-title').value,
        slug:  $('ed-slug').value,
        date:  $('ed-date').value,
        tags:  $('ed-tags').value,
        draft: $('ed-draft').checked,
        body:  $('ed-body').value,
        at: Date.now()
      }));
    }catch(e){ /* quota — ignore, the post still lives in the textarea */ }
  }, 400);
}
function clearDraft(){ localStorage.removeItem(DRAFT_KEY); }

function fillEditor(d){
  $('ed-title').value = d.title || '';
  $('ed-slug').value  = d.slug || '';
  $('ed-date').value  = d.date || today();
  $('ed-tags').value  = d.tags || '';
  $('ed-draft').checked = !!d.draft;
  $('ed-body').value  = d.body || '';
}

function openEditor(slug){
  EDITING = slug || null;
  slugTouched = !!slug;
  showWritePane();
  say('status','','dim');

  if(slug) show('btn-delete'); else hide('btn-delete');

  // an unsaved draft for this same target wins over the committed copy
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); }catch(e){}

  if(saved && saved.editing === EDITING && (saved.body || saved.title)){
    fillEditor(saved);
    say('status','Restored an unsaved draft from this browser.','warn');
    return;
  }

  if(!slug){
    fillEditor({date: today()});
    return;
  }

  say('status','Loading post…','dim');
  loadPostBody(slug).then(function(raw){
    var p = parsePost(raw);
    fillEditor({
      title:p.title, slug:slug, date:p.date,
      tags:(p.tags||[]).join(', '), draft:p.draft, body:p.body
    });
    say('status','','dim');
  }).catch(function(e){
    say('status', e.message, 'err');
  });
}

function showWritePane(){
  show('pane-write'); hide('pane-preview');
  $('tab-write').classList.add('on'); $('tab-preview').classList.remove('on');
}
$('tab-write').onclick = showWritePane;
$('tab-preview').onclick = function(){
  $('pv-title').textContent = $('ed-title').value || 'Untitled';
  $('pv-body').innerHTML = md($('ed-body').value);
  hide('pane-write'); show('pane-preview');
  $('tab-preview').classList.add('on'); $('tab-write').classList.remove('on');

/* ---------- publish ---------- */
$('btn-publish').onclick = function(){
  if(!TOKEN){ say('status','Not authenticated.','err'); return; }

  var title = $('ed-title').value.trim();
  var slug  = ($('ed-slug').value.trim() || slugify(title));
  var date  = $('ed-date').value || today();
  var body  = $('ed-body').value;
  var isDraft = $('ed-draft').checked;
  var tags  = $('ed-tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);

  if(!title){ say('status','A title is required.','err'); return; }
  if(!slug){  say('status','Could not derive a slug. Enter one manually.','err'); return; }
  if(!body.trim()){ say('status','The body is empty.','err'); return; }

  var btn = this;
  btn.disabled = true;
  say('status','Committing post…','dim');

  var meta = {title:title, date:date, tags:tags, draft:isDraft};
  var file = slug + '.md';
  var renamed = EDITING && EDITING !== slug;

  writeFile(file, buildPost(meta, body),
      (EDITING ? 'blog: update ' : 'blog: add ') + slug)
  .then(function(){
    say('status','Post committed. Updating index…','dim');
    return updateManifest(function(list){
      var entry = {
        slug: slug, title: title, date: date,
        tags: tags, draft: isDraft, excerpt: excerptOf(body)
      };
      var out = list.filter(function(p){
        return p.slug !== slug && !(renamed && p.slug === EDITING);
      });
      out.push(entry);
      out.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      return out;
    });
  })
  .then(function(){
    if(renamed) return deleteFile(EDITING + '.md', 'blog: remove old slug ' + EDITING);
  })
  .then(function(){
    clearDraft();
    EDITING = slug;
    show('btn-delete');
    say('status','Published. The live site updates once GitHub Pages rebuilds — usually under a minute. ' +
      '<a href="#/p/' + encodeURIComponent(slug) + '">View post &rarr;</a>', 'ok');
  })
  .catch(function(e){
    say('status', 'Publish failed: ' + esc(e.message), 'err');
  })
  .then(function(){ btn.disabled = false; });
};

/* ---------- delete ---------- */
$('btn-delete').onclick = function(){
  if(!EDITING) return;
  if(!confirm('Delete "' + EDITING + '" permanently? This commits a removal to the repo.')) return;

  var btn = this;
  btn.disabled = true;
  say('status','Deleting…','dim');

  deleteFile(EDITING + '.md', 'blog: delete ' + EDITING)
  .then(function(){
    return updateManifest(function(list){
      return list.filter(function(p){ return p.slug !== EDITING; });
    });
  })
  .then(function(){
    clearDraft();
    say('status','Deleted.','ok');
    setTimeout(function(){ location.hash = '#/'; }, 700);
  })
  .catch(function(e){ say('status','Delete failed: ' + esc(e.message), 'err'); })
  .then(function(){ btn.disabled = false; });
};

/* Read-modify-write the manifest in one shot. Reading immediately
   before the PUT keeps the sha fresh, so two edits in the same
   session cannot collide. */
function updateManifest(fn){
  return readFile('index.json').then(function(cur){
    var list = [];
    if(cur){ try{ list = JSON.parse(cur.text) || []; }catch(e){ list = []; } }
    var next = fn(Array.isArray(list) ? list : []);
    MANIFEST = next;
    return writeFile('index.json', JSON.stringify(next, null, 2), 'blog: update index');
  });
}

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  var h = location.hash.replace(/^#/,'') || '/';
  hide('view-list'); hide('view-post'); hide('view-edit');

  if(h === '/new'){
    if(!TOKEN){ location.hash = '#/'; return; }
    show('view-edit'); openEditor(null); window.scrollTo(0,0); return;
  }

  var m = /^\/edit\/(.+)$/.exec(h);
  if(m){
    if(!TOKEN){ location.hash = '#/'; return; }
    show('view-edit'); openEditor(decodeURIComponent(m[1])); window.scrollTo(0,0); return;
  }

  m = /^\/p\/(.+)$/.exec(h);
  if(m){ show('view-post'); renderPost(decodeURIComponent(m[1])); return; }

  show('view-list'); renderList();
}
window.addEventListener('hashchange', route);

/* ============================================================
   CORRIDOR RAIN — a profiled hallway textured in falling code
   ============================================================
   GEOMETRY
   The cross-section is not a box. It is a closed profile with
   relief: a ceiling beam, a pilaster band running down each
   wall, and a raised walkway strip in the floor. Every step
   between those planes leaves a narrow ledge facing along the
   corridor, so the surfaces read as built rather than flat.
   On top of that, structural ribs pass by at fixed intervals
   of depth — rings of brighter code around the whole profile.

   Each edge of the profile is classified by orientation:
     upright edges (walls, pilasters) carry code falling in
       world +y at a FIXED depth, so each strand projects to a
       vertical line, which is what the reference looks like.
     flat edges (ceiling, floor, ledges) cannot fall downward
       without passing through themselves, so their code flows
       along the corridor toward the camera instead.
   Spacing a strand along the depth axis on every surface is
   what collapses the whole thing into a radial starburst, so
   these two cases are deliberately kept apart.

   DENSITY
   To texture a surface, glyphs need to sit about one glyph
   apart on screen. Perspective makes that a geometric series
   in depth, not a uniform one: to hold screen spacing constant
   the depth step has to grow in proportion to depth, so column
   depths advance by a fixed ratio rather than a fixed amount.
   That lands a few thousand glyphs per frame, which fillText
   cannot do at 60fps on a phone — hence the atlas below.

   ATLAS
   Every glyph is pre-rendered once per size bucket and colour
   tier into an offscreen strip, then blitted with drawImage,
   which is far cheaper than laying out text per glyph. The
   head tier is baked WITH its glow, so the bloom costs nothing
   at runtime — shadowBlur is the most expensive canvas
   operation there is and this removes it from the frame loop
   entirely.

   The room also breathes and bends: half-width and half-height
   modulate with depth so the corridor pinches and swells, and
   the centerline drifts on slow sines of depth so it curves
   away. Every strand slides along its own surface on its own
   frequency and phase, capped below the strand spacing so
   neighbours wander out of step but never cross. Each strand
   randomly ignites to hot white and decays back, so brightness
   is never uniform across the field.
   ============================================================ */
(function(){
  var cv = $('rain'), ctx = cv.getContext('2d');
  var G = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=*+-<>'.split('');
  var NG = G.length;

  var W,H,cx0,cy0,focal,camZ,strands,segs,ribStep,DPR=1;

  var zNear = 1.7, zFar = 16;
  var GLYPH = 0.17;          // world height of one character

  var HW0,HH0,HWamp,HHamp;
  var HWfreq = 0.11, HHfreq = 0.15;
  var bendAmpX,bendAmpY;
  var bendFreqX = 0.085, bendFreqY = 0.060;

  var UPRIGHT = 0, FLAT = 1;

  /* ---------- GRAVITATIONAL WARP ----------------------------------
     Every stream in the room is run through this before projection.
     Each mass drags a point toward itself on an inverse-square falloff
     and spins it tangentially, so streams sag toward a body and wind
     around it — hard near the sun, barely at all in open corridor.
     The softening term (R*R*0.35 in the denominator) is what keeps it
     finite at the centre; without it the pull goes to infinity and
     every nearby glyph snaps onto the body's exact centre.
     SYS.warp scales the whole field, and spikes at impact so the room
     implodes for a moment before the shells go out. */
  var _w = [0,0,0], _wHit = false;
  function warpPoint(x, y, z){
    var hit = false, g = SYS.warp;
    for(var i=0;i<SYS.bodies.length;i++){
      var b = SYS.bodies[i];
      if(b.alive === false || b.vis === false || b.burst) continue;
      var dx = x-b.wx, dy = y-b.wy, dz = z-b.wz;
      var d2 = dx*dx + dy*dy + dz*dz;
      var R2 = b.R*b.R;
      if(d2 > R2*190) continue;             // generous reach: far streams still lean

      var raw = g*R2*1.5/(d2 + R2*2.4);
      if(raw < 0.004) continue;
      hit = true;

      // smooth saturation instead of a hard clamp — a clamp makes the
      // field snap to full strength at some radius, which reads as an
      // abrupt edge rather than a gravity gradient
      var pull = raw/(1 + raw*1.15);

      var d = Math.sqrt(d2);

      // a gentle standing shimmer; the big propagating distortion is
      // handled by the pulse shells below, which actually travel
      var ripple = SYS.ripple*Math.sin(d*1.05 - SYS.t*2.1)*pull*0.45;

      var f = pull*0.62 + ripple;
      x -= dx*f; y -= dy*f; z -= dz*f;

      var sw = pull*0.70;                   // tangential spin
      x += -dy*sw; y += dx*sw;
    }
    /* Pulse shells. Each is an expanding spherical front with a finite
       width; a point is pushed outward only while the front is passing
       over it, and relaxes once it has gone by. That is what makes the
       distortion travel from stream to stream and then release, rather
       than every stream wobbling in place forever. The bump is a plain
       quadratic rather than a gaussian — no exp() in a loop that runs
       thousands of times per frame. */
    for(var q=0;q<SYS.pulses.length;q++){
      var pu = SYS.pulses[q];
      var ex = x-pu.cx, ey = y-pu.cy, ez = z-pu.cz;
      var e2 = ex*ex + ey*ey + ez*ez;
      var hi = pu.r + pu.w;
      if(e2 > hi*hi) continue;                 // outside the front
      var lo = pu.r - pu.w;
      if(lo > 0 && e2 < lo*lo) continue;       // inside, already passed
      var ed = Math.sqrt(e2);
      if(ed < 0.001) continue;
      var gq = (ed - pu.r)/pu.w;
      var env = 1 - gq*gq;
      if(env <= 0) continue;
      var amp = pu.amp*env*pu.life/ed;
      x += ex*amp; y += ey*amp; z += ez*amp;
      hit = true;
    }

    _w[0]=x; _w[1]=y; _w[2]=z; _wHit = hit;
  }

  /* ---------- profile ----------------------------------------
     Normalised closed outline, nx in -1..1 across, ny in -1..1
     from ceiling to floor. Walking it clockwise from the top
     left corner. The small insets are what create the ledges. */
  var PROFILE = [
    [-1.00,-1.00],[-0.52,-1.00],[-0.52,-0.90],[ 0.52,-0.90],   // ceiling + beam
    [ 0.52,-1.00],[ 1.00,-1.00],
    [ 1.00,-0.62],[ 0.91,-0.62],[ 0.91, 0.62],[ 1.00, 0.62],   // right wall + pilaster
    [ 1.00, 1.00],
    [ 0.52, 1.00],[ 0.52, 0.90],[-0.52, 0.90],[-0.52, 1.00],   // floor + walkway
    [-1.00, 1.00],
    [-1.00, 0.62],[-0.91, 0.62],[-0.91,-0.62],[-1.00,-0.62]    // left wall + pilaster
  ];

  /* ============================================================
     GLYPH ATLAS
     ============================================================ */
  var ATLAS_SIZES = [3,4,5,7,9,12,16,21,27,34,42];
  var TIERS = [
    {color:'rgba(46,207,75,1)',  glow:false},   // 0 tail
    {color:'rgba(125,255,155,1)',glow:false},   // 1 near-head
    {color:'rgba(234,255,240,1)',glow:true },   // 2 head, glow baked in
    {color:'rgba(255,74,96,1)',  glow:false}    // 3 red, for the impact glitch
  ];
  var atlas = null;

  /* Laid out as a GRID, not a single row. One row of the largest
     bucket would be over 4000px wide, past the canvas texture limit
     on some iOS devices, where it fails silently and renders blank. */
  var ATLAS_MAXW = 1024;
  function makeStrip(size, tier){
    var pad  = tier.glow ? Math.max(3, size*0.6) : Math.max(1, size*0.14);
    var cell = Math.ceil(size + pad*2);
    var cols = Math.max(1, Math.min(NG, Math.floor(ATLAS_MAXW/cell)));
    var rows = Math.ceil(NG/cols);

    var c = document.createElement('canvas');
    c.width = cell*cols; c.height = cell*rows;
    var g = c.getContext('2d');
    g.font = size + "px 'Share Tech Mono', monospace";
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if(tier.glow){ g.shadowBlur = size*0.65; g.shadowColor = 'rgba(59,255,92,.95)'; }
    g.fillStyle = tier.color;
    for(var i=0;i<NG;i++){
      g.fillText(G[i], (i%cols)*cell + cell*0.5, ((i/cols)|0)*cell + cell*0.5);
    }
    return {cv:c, cell:cell, cols:cols};
  }

  function buildAtlas(){
    atlas = [];
    for(var t=0;t<TIERS.length;t++){
      var row = [];
      for(var si=0;si<ATLAS_SIZES.length;si++) row.push(makeStrip(ATLAS_SIZES[si], TIERS[t]));
      atlas.push(row);
    }
  }

  // largest bucket not exceeding fs
  function sizeIdx(fs){
    for(var i=ATLAS_SIZES.length-1;i>0;i--) if(ATLAS_SIZES[i] <= fs) return i;
    return 0;
  }

  function blit(tier, si, gi, sx, sy, alpha){
    var A = atlas[tier][si], c = A.cell;
    ctx.globalAlpha = alpha;
    ctx.drawImage(A.cv, (gi % A.cols)*c, ((gi/A.cols)|0)*c, c, c,
                        sx - c*0.5, sy - c*0.5, c, c);
  }

  /* ============================================================
     CORRIDOR SHAPE
     ============================================================ */
  /* WAVE_K is deliberately tiny. A meaningful depth term here just
     duplicates the HWamp/HHamp undulation above and, worse, bends the
     ceiling and floor strands into long sweeping arcs as they recede —
     the corridor stops reading as a corridor. Keeping the wave a
     function of the CROSS-SECTION is what makes it a vertical curve. */
  var WAVE_A = 0.150, WAVE_F = 4.2, WAVE_K = 0.05;
  function reliefX(ny, z){ return 1 + WAVE_A*Math.sin(ny*WAVE_F + z*WAVE_K); }
  function reliefY(nx, z){ return 1 + WAVE_A*0.55*Math.sin(nx*WAVE_F*0.8 + z*WAVE_K + 2.1); }

  function hwAt(z){ return HW0 + HWamp*Math.sin(z*HWfreq); }
  function hhAt(z){ return HH0 + HHamp*Math.sin(z*HHfreq + 1.1); }
  function bxAt(z){ return bendAmpX*Math.sin(z*bendFreqX); }
  function byAt(z){ return bendAmpY*Math.sin(z*bendFreqY + 1.3); }

  function rnd(){ return Math.random(); }

  function build(){
    var dpr = Math.min(window.devicePixelRatio||1, 2);
    DPR = dpr;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

    cx0 = W*0.5; cy0 = H*0.32;

    HW0 = 3.0; HH0 = HW0*(H/W);
    if(HH0 < 1.7) HH0 = 1.7;
    if(HH0 > 5.5) HH0 = 5.5;
    HWamp = HW0*0.16; HHamp = HH0*0.14;
    bendAmpX = HW0*0.28; bendAmpY = HH0*0.24;

    // narrow screens need a wider field of view, otherwise the whole
    // corridor shrinks into a thin strip of unreadably small glyphs
    var fov = W < 560 ? 0.76 : 0.60;
    focal = (W*fov*zNear) / HW0;

    camZ = 0;
    ribStep = 2.6;

    if(!atlas) buildAtlas();

    /* ---- classify profile edges ---- */
    segs = [];
    for(var i=0;i<PROFILE.length;i++){
      var a = PROFILE[i], b = PROFILE[(i+1)%PROFILE.length];
      var dx = (b[0]-a[0])*HW0, dy = (b[1]-a[1])*HH0;
      var len = Math.sqrt(dx*dx + dy*dy);
      if(len < 0.01) continue;
      segs.push({
        ax:a[0], ay:a[1], bx:b[0], by:b[1],
        kind: Math.abs(dy) >= Math.abs(dx) ? UPRIGHT : FLAT,
        len: len
      });
    }

    /* ---- populate ----
       density is scaled to viewport so a phone does not try to
       draw a desktop's worth of glyphs */
    var dens = W < 560 ? 1.40 : (W < 900 ? 1.58 : 1.80);
    strands = [];

    for(var s=0;s<segs.length;s++){
      var sg = segs[s];
      if(sg.kind === UPRIGHT) fillUpright(sg, dens);
      else                    fillFlat(sg, dens);
    }

    buildSystem(dens);
  }

  /* Column depths advance by a fixed RATIO, which is what keeps
     their on-screen spacing even under perspective division. */
  function fillUpright(sg, dens){
    var ratio = 1 + (GLYPH/HW0)*0.66/dens;
    var nyLen = Math.abs(sg.by - sg.ay);
    var span  = nyLen*HH0;
    var cap   = Math.max(2, Math.round(span/GLYPH));

    for(var z = zNear; z < zFar; z *= ratio){
      var jitter = z*(ratio-1)*0.35*(rnd()-0.5);
      strands.push(mk({
        kind: UPRIGHT,
        ax: sg.ax, ay: sg.ay, bx: sg.bx, by: sg.by,
        z:    z + jitter,
        head: sg.ay - rnd()*1.4,          // in ny space
        sp:   0.012 + rnd()*0.026,
        len:  Math.max(3, Math.round(cap*(0.80 + rnd()*0.45))),
        dAmp: (0.03 + rnd()*0.05)
      }));
    }
  }

  function fillFlat(sg, dens){
    var latNorm = Math.abs(sg.bx - sg.ax);
    var n = Math.max(3, Math.round(latNorm*HW0/GLYPH*0.85*dens));

    for(var i=0;i<n;i++){
      strands.push(mk({
        kind: FLAT,
        ax: sg.ax, ay: sg.ay, bx: sg.bx, by: sg.by,
        u:    (i + 0.5)/n,
        head: zNear + rnd()*(zFar-zNear),
        sp:   0.013 + rnd()*0.024,
        len:  10 + (rnd()*10|0),
        dAmp: Math.min(0.4/n, 0.05)
      }));
    }
  }

  function mk(o){
    o.dFreq = 0.12 + rnd()*0.26;
    o.phase = rnd()*Math.PI*2;
    o.flash = 0;
    o.g = [];
    for(var i=0;i<26;i++) o.g.push((rnd()*NG)|0);
    return o;
  }

  /* ============================================================
     FRAME
     ============================================================ */
  function frame(){
    var now = Date.now();

    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.33)';
    ctx.fillRect(0,0,W,H);

    camZ += 0.004;

    var maxFs = ATLAS_SIZES[ATLAS_SIZES.length-1];

    for(var i=0;i<strands.length;i++){
      var st = strands[i];

      if(st.flash > 0.02) st.flash *= 0.88; else st.flash = 0;
      if(rnd() < 0.0030) st.flash = 1;

      // mutate a glyph or two rather than the whole strand
      if(rnd() < 0.30) st.g[(rnd()*st.g.length)|0] = (rnd()*NG)|0;
      if(rnd() < 0.22) st.g[0] = (rnd()*NG)|0;

      var wob = st.dAmp*Math.sin(now*0.001*st.dFreq + st.phase);

      if(st.kind === UPRIGHT) drawUpright(st, wob, maxFs);
      else                    drawFlat(st, wob, maxFs);
    }

    drawRibs(now);
    drawSystem(now, maxFs);
    drawGlitch(now);
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  /* Fixed depth, falling in ny — projects to a vertical line. */
  function drawUpright(st, wob, maxFs){
    var z = st.z - camZ;
    if(z < zNear){ st.z = camZ + zFar; return; }
    if(z > zFar) return;

    var zc = st.z, k = focal/z;
    var hw = hwAt(zc), hh = hhAt(zc);
    var bx = bxAt(zc), by = byAt(zc);

    var fs = GLYPH*k;
    if(fs > maxFs) fs = maxFs;
    if(fs < ATLAS_SIZES[0]) return;
    var si = sizeIdx(fs);

    var fade = 1 - (z - zNear)/(zFar - zNear);
    if(fade <= 0) return;
    fade = fade*fade*0.55 + fade*0.45;       // hold the near field brighter

    var lo = Math.min(st.ay, st.by), hi = Math.max(st.ay, st.by);
    var stepNy = GLYPH/hh;

    st.head += st.sp/hh;
    if(st.head - st.len*stepNy > hi) st.head = lo - rnd()*1.2;

    for(var s=0;s<st.len;s++){
      var ny = st.head - s*stepNy;
      if(ny < lo || ny > hi) continue;

      // lerp nx across the edge in case it is not perfectly upright
      var t  = (hi - lo) < 1e-6 ? 0 : (ny - st.ay)/(st.by - st.ay);
      var nx = st.ax + (st.bx - st.ax)*t + wob*0.1;

      warpPoint(bx + nx*hw*reliefX(ny, zc), by + ny*hh*reliefY(nx, zc), z);

      // only pay for a size lookup when the point actually moved
      var kk = k, ss = si;
      if(_wHit){
        if(_w[2] < 0.65) continue;
        kk = focal/_w[2];
        var f2 = GLYPH*kk;
        if(f2 > maxFs) f2 = maxFs;
        if(f2 < ATLAS_SIZES[0]) continue;
        ss = sizeIdx(f2);
      }
      var sx = cx0 + _w[0]*kk, sy = cy0 + _w[1]*kk;
      if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

      paint(st, s, ss, sx, sy, fade);
    }
  }

  /* Flows along the corridor; depth changes down the strand, so
     the step grows with depth to keep screen spacing even. */
  function drawFlat(st, wob, maxFs){
    st.head -= st.sp;
    if(st.head < zNear) st.head = zFar;

    var z = st.head;
    for(var s=0;s<st.len;s++){
      if(z > zFar) break;
      var zc = z + camZ, k = focal/z;
      var hw = hwAt(zc), hh = hhAt(zc);

      var u  = st.u + wob;
      var nx = st.ax + (st.bx - st.ax)*u;
      var ny = st.ay + (st.by - st.ay)*u;

      warpPoint(bxAt(zc) + nx*hw*reliefX(ny, zc),
                byAt(zc) + ny*hh*reliefY(nx, zc), z);
      var kk = _wHit ? (_w[2] < 0.65 ? -1 : focal/_w[2]) : k;
      if(kk > 0){
        var sx = cx0 + _w[0]*kk, sy = cy0 + _w[1]*kk;
        var fs = GLYPH*kk;
        if(fs > maxFs) fs = maxFs;
        if(fs >= ATLAS_SIZES[0] && sx > -40 && sx < W+40 && sy > -40 && sy < H+40){
          var fade = 1 - (z - zNear)/(zFar - zNear);
          if(fade > 0) paint(st, s, sizeIdx(fs), sx, sy, fade*fade*0.55 + fade*0.45);
        }
      }
      z += GLYPH*z/hh;
    }
  }

  function paint(st, s, si, sx, sy, fade){
    var a = fade*(1 - s/st.len*0.55);
    if(a < 0.025) return;
    if(a > 1) a = 1;

    var gi = st.g[s % st.g.length];

    if(s === 0){
      if(st.flash > 0.12){
        var f = a + st.flash*0.8;
        blit(2, si, gi, sx, sy, f > 1 ? 1 : f);
      } else {
        blit(2, si, gi, sx, sy, a);
      }
    } else if(s < 3){
      blit(1, si, gi, sx, sy, a*0.9);
    } else {
      blit(0, si, gi, sx, sy, a*0.92);
    }
  }

  /* Structural ribs: rings of code around the whole profile at
     fixed intervals of depth, so the corridor has landmarks
     passing by rather than being a featureless extrusion. */
  var RIB_SAMPLES = 78;
  function drawRibs(now){
    var maxFs = ATLAS_SIZES[ATLAS_SIZES.length-1];
    var n0 = Math.ceil((camZ + zNear)/ribStep);
    var n1 = Math.floor((camZ + zFar)/ribStep);

    for(var n=n0;n<=n1;n++){
      var zc = n*ribStep, z = zc - camZ;
      var k  = focal/z;
      var hw = hwAt(zc), hh = hhAt(zc), bx = bxAt(zc), by = byAt(zc);

      var fs = GLYPH*k*1.05;
      if(fs > maxFs) fs = maxFs;
      if(fs < ATLAS_SIZES[0]) continue;
      var si = sizeIdx(fs);

      var fade = 1 - (z - zNear)/(zFar - zNear);
      if(fade <= 0) continue;
      var a = (fade*fade*0.5 + fade*0.5)*0.34;

      var pulse = 0.72 + 0.28*Math.sin(now*0.0016 + n*1.7);

      // walk the profile by arc length so samples land evenly
      var total = 0, q;
      for(q=0;q<segs.length;q++) total += segs[q].len;
      var stepLen = total/RIB_SAMPLES, acc = 0, si2 = 0, carry = 0;

      for(q=0;q<segs.length;q++){
        var sg = segs[q], t = carry;
        while(t < sg.len){
          var u  = t/sg.len;
          var nx = sg.ax + (sg.bx - sg.ax)*u;
          var ny = sg.ay + (sg.by - sg.ay)*u;
          var sx = cx0 + (bx + nx*hw*reliefX(ny, zc))*k;
          var sy = cy0 + (by + ny*hh*reliefY(nx, zc))*k;
          if(sx > -40 && sx < W+40 && sy > -40 && sy < H+40){
            blit(0, si, ((n*37 + (t*13|0)) % NG), sx, sy, a*pulse);
          }
          t += stepLen;
        }
        carry = t - sg.len;
      }
    }
  }

  /* ============================================================
     SOLAR SYSTEM
     ============================================================
     A sun sits at a fixed distance down the corridor with bodies
     orbiting it, so Saturn swings out of frame and comes back
     rather than being parked in the middle. Moons orbit their
     planet, not the sun, so a body's position is always its
     parent's position plus its own orbit — which means parents
     must be solved before children each frame.

     Orbit planes and ring planes are both defined by a NORMAL,
     never by a chain of Euler angles. A circle of radius r
     projects to an ellipse whose minor axis is r*|n.z| and whose
     major axis runs perpendicular to (n.x, n.y). Two ring sets
     tilted about a SHARED axis therefore end up sharing a
     major-axis direction and merge into one ordinary ring
     system; to read as an X their normals have to sit near the
     view plane and point 90 degrees apart.

     Asteroid ribbons are not orbits. Each one is a twisted path
     down the corridor — its angle and radius both wander on
     slow sines of depth — and every particle is then pushed out
     of any body's influence sphere. That deflection is what
     makes the ribbons appear to bend around the planets rather
     than pass through them.

     Depth is resolved by painter's order: ribbons first, then
     bodies sorted far to near, and within a body its far rings,
     then the globe, then its near rings. A ring particle behind
     its planet's plane is dropped when it projects inside the
     globe's disc, which is what lets rings pass behind the
     sphere without a depth buffer.
     ============================================================ */
  /* zBase/fgAmp swing the whole system toward the camera and back on a
     long cycle, so the sun and Saturn periodically loom in the
     foreground instead of sitting at a fixed distance forever. */
  var SYS = {
    z: 7.6, zBase: 8.7, fgAmp: 3.3, fgSp: 0.081,
    t: 0, bodies: [], ribbons: [],
    strips: [], shocks: [], disk: [], glitch: 0, accrete: 0, strip: 0,
    reformAt: -1, warp: 1, ripple: 0.16, dens: 1, ev: null, parts: [],
    pulses: [], nextPulse: 5, nextFlick: 10, orbTh: 0, title: null
  };

  var RING_BANDS = [[1.70,1.94],[2.34,2.78]];

  function glyphRun(n){
    var a = [];
    for(var i=0;i<n;i++) a.push((rnd()*NG)|0);
    return a;
  }

  /* Orthonormal basis for a plane given by psi (which way the normal
     leans) and eps (how far it tilts out of the view plane). */
  function planeBasis(psi, eps, rho, out){
    var ce = Math.cos(eps);
    var bx = Math.cos(psi)*ce, by = Math.sin(psi)*ce, bz = Math.sin(eps);
    var cr = Math.cos(rho), sr = Math.sin(rho);
    var nx = bx*cr + bz*sr, ny = by, nz = -bx*sr + bz*cr;

    var ux, uy, uz;
    if(Math.abs(nz) < 0.9){ ux = ny; uy = -nx; uz = 0; }
    else { ux = 0; uy = nz; uz = -ny; }
    var ul = Math.sqrt(ux*ux + uy*uy + uz*uz) || 1;
    ux /= ul; uy /= ul; uz /= ul;

    var vx = ny*uz - nz*uy, vy = nz*ux - nx*uz, vz = nx*uy - ny*ux;
    var vl = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;

    out.ux = ux; out.uy = uy; out.uz = uz;
    out.vx = vx/vl; out.vy = vy/vl; out.vz = vz/vl;
  }

  function mkSphere(bands, perBand, spBase){
    var a = [];
    for(var b=0;b<bands;b++){
      var th = Math.PI*(b+0.5)/bands;
      var n  = Math.max(2, Math.round(perBand*Math.sin(th)));
      for(var j=0;j<n;j++){
        a.push({
          th: th,
          lam: 2*Math.PI*(j + rnd()*0.6)/n,
          // differential rotation: equator outruns the poles
          sp: (spBase*0.55 + spBase*Math.sin(th))*(0.85 + rnd()*0.3),
          len: 3 + (rnd()*4|0),
          flash: 0,
          g: glyphRun(10)
        });
      }
    }
    return a;
  }

  function mkRings(R, d){
    var out = [];
    for(var set=0; set<2; set++){
      for(var b=0;b<RING_BANDS.length;b++){
        var r0 = RING_BANDS[b][0]*R, r1 = RING_BANDS[b][1]*R;
        for(var q=0;q<2;q++){
          var r = r0 + (r1-r0)*(q+0.5)/2;
          var n = Math.max(12, Math.round(2*Math.PI*r/GLYPH*d*0.88));
          for(var i=0;i<n;i++){
            out.push({
              set: set, r: r,
              phi: 2*Math.PI*(i + rnd()*0.7)/n,
              sp: 0.0024*Math.pow(R*1.5/r, 1.5),   // roughly Keplerian
              gi: (rnd()*NG)|0, tw: rnd()*Math.PI*2,
              sx:0, sy:0, fs:0, nf:0, behind:false, vis:false
            });
          }
        }
      }
    }
    return out;
  }

  function mkFlares(n){
    var f = [];
    for(var i=0;i<n;i++){
      f.push({
        th: Math.acos(2*rnd()-1),      // uniform over the sphere
        ph: rnd()*Math.PI*2,
        len: 15 + (rnd()*20|0),
        reach: 1.5 + rnd()*3.0,        // in solar radii
        curve: (rnd()-0.5)*1.5,        // sideways arc as it climbs
        beat: rnd()*Math.PI*2,
        beatSp: 0.0013 + rnd()*0.0034,
        drift: (rnd()-0.5)*0.0022,
        g: glyphRun(26)
      });
    }
    return f;
  }

  function buildSystem(dens){
    var d = Math.min(1.35, dens);
    SYS.bodies = [];

    // 0 — sun
    SYS.bodies.push({
      kind:'sun', parent:-1, R:1.30,
      orbitR:0, orbitSp:0, th:0, psi:0, eps:0, ob:{},
      tilt:0.20, spin:0, spinSp:0.0009,
      sphere: mkSphere(Math.round(20*d), Math.round(18*d), 0.0024),
      flares: mkFlares(Math.round(46*d)),
      rings: null, sets: null, halo: 2.2, alive:true, vis:true, prime:true, fg:0, fgSp:0, fgPh:0,
      wx:0, wy:0, wz:0, k:0
    });

    // 1 — Saturn, the ringed one
    SYS.bodies.push({
      kind:'planet', parent:0, R:1.02,
      orbitR:5.8, orbitSp:0.00040, th:rnd()*6.283,
      psi:-0.55, eps:1.02, ob:{},
      tilt:0.34, spin:0, spinSp:0.0013,
      sphere: mkSphere(Math.round(17*d), Math.round(15*d), 0.0021),
      rings: mkRings(1.02, d),
      sets: [ {psi:-Math.PI/4, eps:0.30, b:{}}, {psi:Math.PI/4, eps:0.52, b:{}} ],
      rho:0, rhoSp:0.0007, halo:3.1, alive:true, vis:true, prime:true,
      fg:0, fgSp:0, fgPh:0,
      wx:0, wy:0, wz:0, k:0
    });

    // 2 — inner planet
    SYS.bodies.push({
      kind:'planet', parent:0, R:0.52,
      orbitR:3.1, orbitSp:0.00082, th:rnd()*6.283,
      psi:0.75, eps:0.95, ob:{},
      tilt:0.22, spin:0, spinSp:0.0018,
      sphere: mkSphere(Math.round(13*d), Math.round(11*d), 0.0026),
      rings:null, sets:null, halo:1.5, alive:true, vis:true, fg:0, fgSp:0, fgPh:0,
      wx:0, wy:0, wz:0, k:0
    });

    // 3, 4 — moons of Saturn
    SYS.bodies.push({
      kind:'moon', parent:1, R:0.20,
      orbitR:1.45, orbitSp:0.0040, th:rnd()*6.283,
      psi:0.4, eps:0.80, ob:{},
      tilt:0.1, spin:0, spinSp:0.0030,
      sphere: mkSphere(Math.round(8*d), Math.round(7*d), 0.0030),
      rings:null, sets:null, halo:0, alive:true, vis:true, fg:0, fgSp:0, fgPh:0,
      wx:0, wy:0, wz:0, k:0
    });
    SYS.bodies.push({
      kind:'moon', parent:1, R:0.14,
      orbitR:2.05, orbitSp:-0.0028, th:rnd()*6.283,
      psi:-1.1, eps:0.88, ob:{},
      tilt:0.1, spin:0, spinSp:0.0026,
      sphere: mkSphere(Math.round(7*d), Math.round(6*d), 0.0030),
      rings:null, sets:null, halo:0, alive:true, vis:true, fg:0, fgSp:0, fgPh:0,
      wx:0, wy:0, wz:0, k:0
    });

    // 5 — moon of the inner planet
    SYS.bodies.push({
      kind:'moon', parent:2, R:0.13,
      orbitR:0.95, orbitSp:0.0052, th:rnd()*6.283,
      psi:1.5, eps:0.85, ob:{},
      tilt:0.1, spin:0, spinSp:0.0032,
      sphere: mkSphere(Math.round(7*d), Math.round(6*d), 0.0030),
      rings:null, sets:null, halo:0, alive:true, vis:true, fg:0, fgSp:0, fgPh:0,
      wx:0, wy:0, wz:0, k:0
    });

    SYS.dens = d;
    initOrb(SYS.bodies[0]);
    initOrb(SYS.bodies[1]);
    SYS.orbTh = rnd()*6.283;
    /* Two gas giants on long slow orbits. Their visibility windows are
       offset half a cycle apart so they are almost never up at once —
       which is both the look wanted and what keeps the glyph budget
       flat, since one dense atmosphere costs about as much as the rest
       of the system put together. */
    addGas(d, {R:1.18, orbitR:5.6, orbitSp:0.00014, psi:-0.9, eps:1.00,
               tilt: 0.24, spinSp:0.00042, period:120, on:0.30, pt:6});
    addGas(d, {R:0.96, orbitR:6.7, orbitSp:0.00011, psi: 0.6, eps:1.12,
               tilt:-0.30, spinSp:0.00036, period:120, on:0.30, pt:66});

    buildRibbons(d);
    initInfall();
    initEvent();
  }

  function buildRibbons(d){
    SYS.ribbons = [];
    var nRib = Math.max(6, Math.round(15*d));
    for(var r=0;r<nRib;r++){
      var rib = {
        a0: rnd()*6.283,
        twist: 0.16 + rnd()*0.30,      // how fast the angle winds with depth
        f1: 0.22 + rnd()*0.30,         // angular wander
        f2: 0.16 + rnd()*0.26,         // radial wander
        sw: 0.25 + rnd()*0.55,
        r0: 0.7 + rnd()*2.1,
        r1: 0.30 + rnd()*0.60,
        yk: 0.45 + rnd()*0.55,         // flattens the swirl vertically
        ph: rnd()*6.283,
        pts: []
      };
      var n = Math.max(16, Math.round(38*d));
      for(var i=0;i<n;i++){
        rib.pts.push({
          z: zNear + (i + rnd())*(zFar-zNear)/n,
          sp: 0.005 + rnd()*0.011,
          gi: (rnd()*NG)|0,
          tw: rnd()*6.283
        });
      }
      SYS.ribbons.push(rib);
    }
  }

  /* ============================================================
     DETONATION — click the title to blow the scene apart
     ============================================================
     Four beats on one clock:

       burst      each body pops in turn, a fraction of a second
                  apart, so the failure cascades outward instead of
                  everything going at once. The body vanishes at its
                  own moment and is replaced by loose glyphs thrown
                  from its surface.
       drift      the glyphs coast outward against drag and fade
                  down to almost nothing — the letters going black.
       reseed     at the darkest point the system is rebuilt with new
                  sizes, orbits, ring tilts, sweep directions and wall
                  curvature. Nothing is visible, so the swap is free.
       reassemble every glyph is assigned a point on one of the NEW
                  bodies and flies to it. Targets are recomputed from
                  the live body each frame rather than baked once, so
                  the swarm homes onto bodies that are themselves
                  moving, and lands cleanly instead of converging on
                  a stale position.
     ============================================================ */
  var EV_DRIFT = 2.10;     // burst + coast
  var EV_END   = 4.30;     // reassembly complete

  function initEvent(){
    SYS.ev = { on:false, t:0, reseeded:false };
    SYS.parts = [];
  }

  function detonate(){
    if(!SYS.ev || SYS.ev.on) return;
    SYS.ev.on = true; SYS.ev.t = 0; SYS.ev.reseeded = false;
    SYS.parts.length = 0;

    SYS.glitch = 1;
    SYS.warp   = 2.4;
    SYS.ripple = 1.0;
    SYS.strip  = 0;
    SYS.shocks = [];

    // cascade order: nearest first, so it reads as coming at you
    var order = SYS.bodies.slice().filter(function(b){
      return b.vis !== false && b.alive !== false;
    }).sort(function(a,c){ return a.wz - c.wz; });

    for(var i=0;i<SYS.bodies.length;i++) SYS.bodies[i].det = 1e9;
    for(var j=0;j<order.length;j++){
      order[j].det = 0.05 + j*0.15;
      order[j].burst = false;
    }
  }

  function burstBody(b){
    var n = Math.round(b.R*150);
    if(n < 26) n = 26; else if(n > 240) n = 240;

    for(var i=0;i<n;i++){
      var th = Math.acos(2*rnd()-1), ph = rnd()*6.283;
      var st = Math.sin(th);
      var dx = st*Math.cos(ph), dy = Math.cos(th), dz = st*Math.sin(ph);
      var sp = (0.030 + rnd()*0.075)*(0.55 + b.R);
      SYS.parts.push({
        x: b.wx + dx*b.R, y: b.wy + dy*b.R, z: b.wz + dz*b.R,
        vx: dx*sp + (rnd()-0.5)*0.012,
        vy: dy*sp + (rnd()-0.5)*0.012,
        vz: dz*sp + (rnd()-0.5)*0.012,
        gi: (rnd()*NG)|0,
        bi: 0, th: 0, ph: 0, rr: 1,
        ox:0, oy:0, oz:0
      });
    }

    // the rings go up too
    if(b.rings){
      for(var r=0;r<b.rings.length;r+=3){
        var p = b.rings[r];
        if(!p.vis) continue;
        var a2 = rnd()*6.283, e2 = Math.acos(2*rnd()-1);
        var s2 = Math.sin(e2);
        var sp2 = 0.035 + rnd()*0.06;
        SYS.parts.push({
          x: b.wx + p.r*Math.cos(p.phi), y: b.wy, z: b.wz + p.r*Math.sin(p.phi),
          vx: s2*Math.cos(a2)*sp2, vy: Math.cos(e2)*sp2*0.6, vz: s2*Math.sin(a2)*sp2,
          gi: p.gi, bi:0, th:0, ph:0, rr:1, ox:0, oy:0, oz:0
        });
      }
    }

    emitShock(0, b.wx, b.wy, b.wz);
    emitPulse(b.wx, b.wy, b.wz, 0.9 + b.R*0.6);
    SYS.glitch = 1;
  }

  /* New scene. Only parameters change — the glyph pools, atlas and
     corridor geometry are all reused, so this is cheap enough to run
     mid-animation. */
  function reseedScene(){
    var d = SYS.dens || 1;
    var sun = SYS.bodies[0], sat = SYS.bodies[1], inner = SYS.bodies[2];

    sun.R = 1.05 + rnd()*0.55;
    sun.tilt = 0.12 + rnd()*0.35;
    sun.spinSp = 0.0006 + rnd()*0.0010;

    sat.R = 0.80 + rnd()*0.48;
    sat.tilt = 0.18 + rnd()*0.38;
    sat.rings = mkRings(sat.R, d);
    sat.sets[0].psi = -Math.PI/4 + (rnd()-0.5)*0.7;
    sat.sets[1].psi =  Math.PI/4 + (rnd()-0.5)*0.7;
    sat.sets[0].eps = 0.22 + rnd()*0.26;
    sat.sets[1].eps = 0.42 + rnd()*0.30;
    sat.rhoSp = 0.0004 + rnd()*0.0009;

    inner.R = 0.40 + rnd()*0.30;
    inner.R0 = inner.R;
    inner.orbitR = 2.6 + rnd()*1.2;
    inner.orbitR0 = inner.orbitR;
    inner.orbitSp = 0.00065 + rnd()*0.0006;
    inner.orbitSp0 = inner.orbitSp;
    inner.alive = true;
    SYS.strip = 0; SYS.reformAt = -1;

    var gi = 0;
    for(var gj=0;gj<SYS.bodies.length;gj++){
      var jup = SYS.bodies[gj];
      if(jup.kind !== 'gas') continue;
      jup.R = 0.88 + rnd()*0.50;
      jup.tilt = (rnd() < 0.5 ? 1 : -1)*(0.12 + rnd()*0.38);
      jup.orbitR = 4.8 + rnd()*2.4;
      jup.orbitSp = 0.00010 + rnd()*0.00012;
      jup.gas = buildGas(d, W < 560);
      jup.appear.on = 0.24 + rnd()*0.14;
      // keep the two windows opposed after a reseed
      jup.pt = (gi === 0 ? 4 : jup.appear.period*0.5 + 4);
      gi++;
    }

    for(var i=3;i<SYS.bodies.length;i++){
      var m = SYS.bodies[i];
      if(m.kind !== 'moon') continue;
      m.R = 0.11 + rnd()*0.14;
      m.orbitR = 0.9 + rnd()*1.5;
      m.orbitSp = (rnd() < 0.5 ? -1 : 1)*(0.0024 + rnd()*0.0035);
      m.eps = 0.6 + rnd()*0.5;
      m.alive = true;
    }


    // new room: different wall curvature and bend
    WAVE_A = 0.10 + rnd()*0.13;
    WAVE_F = 3.0 + rnd()*2.6;
    bendAmpX = HW0*(0.18 + rnd()*0.26);
    bendAmpY = HH0*(0.16 + rnd()*0.24);

    buildRibbons(d);

    // pick up somewhere new in the orbit rather than restarting the lap
    SYS.orbTh = rnd()*6.283;
    newOrbTargets(SYS.bodies[0].orb);
    newOrbTargets(SYS.bodies[1].orb);
  }

  /* Assign every loose glyph a home on one of the new bodies, weighted
     by surface area so big bodies claim proportionally more. */
  function assignTargets(){
    var pool = [], w = [], total = 0, i;
    for(i=0;i<SYS.bodies.length;i++){
      var b = SYS.bodies[i];
      if(b.alive === false || b.vis === false) continue;
      pool.push(i);
      var a = b.R*b.R;
      total += a; w.push(total);
    }
    if(!pool.length) return;

    for(i=0;i<SYS.parts.length;i++){
      var p = SYS.parts[i];
      var pick = rnd()*total, j = 0;
      while(j < w.length-1 && pick > w[j]) j++;
      p.bi = pool[j];
      p.th = Math.acos(2*rnd()-1);
      p.ph = rnd()*6.283;
      p.rr = 1 + (rnd() < 0.22 ? 0.7 + rnd()*1.4 : 0);  // some land in the rings
      p.ox = p.x; p.oy = p.y; p.oz = p.z;               // where the drift left it
    }
  }

  function updateEvent(now, maxFs){
    var ev = SYS.ev;
    if(!ev || !ev.on) return;
    ev.t += 0.016;

    // burst bodies as their moment arrives
    for(var i=0;i<SYS.bodies.length;i++){
      var b = SYS.bodies[i];
      if(!b.burst && ev.t >= b.det){ b.burst = true; burstBody(b); }
    }

    if(!ev.reseeded && ev.t >= EV_DRIFT){
      reseedScene();
      assignTargets();
      ev.reseeded = true;
    }

    var reU = 0;
    if(ev.reseeded){
      reU = (ev.t - EV_DRIFT)/(EV_END - EV_DRIFT);
      if(reU > 1) reU = 1;
      reU = reU*reU*(3 - 2*reU);            // smoothstep, so it settles
    }

    for(var q=0;q<SYS.parts.length;q++){
      var p = SYS.parts[q];

      if(!ev.reseeded){
        p.x += p.vx; p.y += p.vy; p.z += p.vz;
        p.vx *= 0.979; p.vy *= 0.979; p.vz *= 0.979;
      } else {
        var b2 = SYS.bodies[p.bi];
        var st = Math.sin(p.th);
        var tr = b2.R*p.rr;
        var tx = b2.wx + st*Math.cos(p.ph)*tr;
        var ty = b2.wy + Math.cos(p.th)*tr*(p.rr > 1 ? 0.25 : 1);
        var tz = b2.wz + st*Math.sin(p.ph)*tr;
        p.x = p.ox + (tx - p.ox)*reU;
        p.y = p.oy + (ty - p.oy)*reU;
        p.z = p.oz + (tz - p.oz)*reU;
      }

      if(p.z < 0.8) continue;
      var k = focal/p.z;
      var sx = cx0 + p.x*k, sy = cy0 + p.y*k;
      if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

      var fs = GLYPH*k;
      if(fs > maxFs) fs = maxFs;
      if(fs < ATLAS_SIZES[0]) continue;

      /* Brightness is the whole story of the beat: hot at the burst,
         guttering down to almost nothing through the drift, then
         coming back up as the new scene assembles. */
      var a, tier;
      if(!ev.reseeded){
        var fade = 1 - (ev.t/EV_DRIFT);
        a = 0.12 + 0.88*fade*fade;
        tier = a > 0.66 ? 2 : (a > 0.30 ? 1 : 0);
      } else {
        a = 0.12 + 0.88*reU;
        tier = reU > 0.72 ? 2 : (reU > 0.34 ? 1 : 0);
      }
      if(rnd() < 0.07) p.gi = (rnd()*NG)|0;
      blit(tier, sizeIdx(fs), p.gi, sx, sy, a);
    }

    if(ev.t >= EV_END){
      ev.on = false;
      SYS.parts.length = 0;
      for(var r=0;r<SYS.bodies.length;r++){ SYS.bodies[r].burst = false; SYS.bodies[r].det = 1e9; }
      var db = document.getElementById('btn-detonate');
      if(db) db.disabled = false;
      startTitle();
    }
  }

  /* ============================================================
     GAS GIANT — banded atmosphere, built from flowing streams
     ============================================================
     Not a uniform glyph shell like the other bodies. The surface is
     a set of latitude bands whose streams run ZONALLY: adjacent
     bands flow in opposite directions, fastest at the equator and
     slowing toward the poles, and all of them move considerably
     faster than the planet's own rotation. That shear between
     neighbouring bands is what makes it read as weather rather than
     as a spinning ball.

     Several shells sit at slightly different radii with their own
     speeds and opacities, so the bands interleave and you can see
     one layer sliding past another.

     Three disturbances run on top:
       eye      a vortex of particles circling a drifting centre,
                inner rings turning faster than outer ones.
       bend     any single stream can occasionally bulge outward and
                settle back, independent of its neighbours — the
                trigger is per-stream, so the bulges never line up.
       breathe  once in a while the whole atmosphere inflates to a
                wider radius and contracts again.
     ============================================================ */

  function addGas(d, cfg){
    SYS.bodies.push({
      kind:'gas', parent:0, R:cfg.R,
      orbitR:cfg.orbitR, orbitSp:cfg.orbitSp, th:rnd()*6.283,
      psi:cfg.psi, eps:cfg.eps, ob:{},
      tilt:cfg.tilt, spin:0, spinSp:cfg.spinSp,
      sphere: [], rings:null, sets:null, halo:1.9,
      alive:true, vis:true, fade:0,
      appear:{period:cfg.period, on:cfg.on}, pt:cfg.pt,
      gas: buildGas(d, W < 560),
      wx:0, wy:0, wz:0, k:0
    });
  }

  function buildGas(d, small){
    var g = {
      layers: [], spot: [],
      breathe: 0, bOn: false, bClock: 0, bNext: 10 + rnd()*14, bDur: 7,
      spotTh: 1.85 + (rnd()-0.5)*0.5,
      spotLam: rnd()*6.283
    };

    var LAY = small ? 3 : 4;
    for(var l=0;l<LAY;l++){
      var nb = Math.round((11 + l*2)*d);
      var streams = [];
      for(var bnd=0;bnd<nb;bnd++){
        var th = Math.PI*(bnd + 0.5)/nb;
        // alternating jets, fastest at the equator, well above spin rate
        var dir = (bnd % 2) ? -1 : 1;
        var zonal = dir*(0.0045 + 0.0115*Math.sin(th)*Math.sin(th))*(1 - l*0.16);
        var n = Math.max(5, Math.round(15*Math.sin(th)*d));
        for(var j=0;j<n;j++){
          streams.push({
            th: th + (rnd()-0.5)*(Math.PI/nb)*0.55,
            lam: 2*Math.PI*(j + rnd()*0.7)/n,
            sp: zonal*(0.85 + rnd()*0.3),
            len: 6 + (rnd()*5|0),
            g: glyphRun(12),
            ba: (bnd % 2) ? 0.62 : 1.0,      // alternating band contrast
            bAmp: 0, bDur: 1, bT: 0
          });
        }
      }
      g.layers.push({
        rmul: 1 + l*0.052,
        alpha: 1 - l*0.15,
        drift: (l - (LAY-1)*0.5)*0.0016,     // shells shear against each other
        streams: streams
      });
    }

    var ns = Math.round((small ? 70 : 115)*d);
    for(var i=0;i<ns;i++){
      var rr = 0.10 + Math.pow(rnd(), 0.6)*0.30;
      g.spot.push({
        rr: rr,
        a: rnd()*6.283,
        sp: 0.010/(rr + 0.09),        // inner rings turn faster
        gi: (rnd()*NG)|0
      });
    }
    return g;
  }

  function drawGas(b, now, maxFs){
    var G2 = b.gas;
    if(!G2) return;
    var vis = b.fade === undefined ? 1 : b.fade;
    if(vis <= 0.02) return;

    /* ---- whole-atmosphere breathing ---- */
    G2.bClock += 0.016;
    if(!G2.bOn){
      if(G2.bClock > G2.bNext){
        G2.bOn = true; G2.bClock = 0;
        G2.bDur = 6 + rnd()*5;
        G2.bPeak = 0.30 + rnd()*0.28;
      }
    } else {
      var bu = G2.bClock/G2.bDur;
      if(bu >= 1){
        G2.bOn = false; G2.bClock = 0; G2.breathe = 0;
        G2.bNext = 15 + rnd()*18;
      } else {
        G2.breathe = Math.sin(Math.PI*bu)*G2.bPeak;   // out and back
      }
    }

    var ct = Math.cos(b.tilt), st = Math.sin(b.tilt);
    var stride = lodStride(b.R*focal/b.wz);
    b.spin += b.spinSp;

    for(var l=0;l<G2.layers.length;l++){
      var lay = G2.layers[l];
      for(var i=0;i<lay.streams.length;i+=stride){
        var s = lay.streams[i];
        s.lam += s.sp + lay.drift;

        /* ---- independent per-stream bulge ----
           Triggered per stream, so no two go at the same moment and
           the surface never pulses as a whole. */
        if(s.bAmp > 0){
          s.bT += 0.016;
          if(s.bT >= s.bDur){ s.bAmp = 0; s.bT = 0; }
        } else if(rnd() < 0.00075){
          s.bAmp = 0.22 + rnd()*0.55;
          s.bDur = 1.6 + rnd()*2.4;
          s.bT = 0;
        }
        var bend = s.bAmp > 0 ? Math.sin(Math.PI*(s.bT/s.bDur))*s.bAmp : 0;

        var rr = b.R*lay.rmul*(1 + G2.breathe + bend);
        var sinth = Math.sin(s.th), costh = Math.cos(s.th);
        // a bulging stream also stretches along its own flow
        var dLam = GLYPH*(1 + bend*1.3)/(rr*(sinth < 0.28 ? 0.28 : sinth));

        for(var t=0;t<s.len;t++){
          var lam = s.lam - t*dLam + b.spin;
          var x = rr*sinth*Math.cos(lam);
          var y = rr*costh;
          var z = rr*sinth*Math.sin(lam);

          var ty = y*ct - z*st, tz = y*st + z*ct;
          if(tz > 0) continue;                       // far side

          var Z = b.wz + tz;
          if(Z < 0.7) continue;
          var k = focal/Z;
          var sx = cx0 + (b.wx + x)*k, sy = cy0 + (b.wy + ty)*k;
          if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

          var fs = GLYPH*k;
          if(fs > maxFs) fs = maxFs;
          if(fs < ATLAS_SIZES[0]) continue;

          var face = -tz/rr;
          var a = (0.26 + 0.74*face)*(1 - t/s.len*0.55)*lay.alpha*s.ba*vis;
          if(bend > 0) a *= 1 + bend*0.5;
          if(a < 0.03) continue;
          if(a > 1) a = 1;
          if(rnd() < 0.05) s.g[t % s.g.length] = (rnd()*NG)|0;

          blit(t === 0 ? 2 : (t < 2 ? 1 : 0), sizeIdx(fs), s.g[t % s.g.length], sx, sy, a);
        }
      }
    }

    /* ---- the eye ---- */
    G2.spotLam += 0.0013;                            // drifts against the jets
    var sr = b.R*(1 + G2.breathe)*1.012;
    var sinSpot = Math.sin(G2.spotTh);
    if(sinSpot < 0.25) sinSpot = 0.25;

    for(var q=0;q<G2.spot.length;q+=stride){
      var p = G2.spot[q];
      p.a += p.sp;
      var lat = G2.spotTh + p.rr*Math.sin(p.a)*0.55;
      var lon = G2.spotLam + p.rr*Math.cos(p.a)/sinSpot + b.spin;

      var sl = Math.sin(lat), cl = Math.cos(lat);
      var x2 = sr*sl*Math.cos(lon), y2 = sr*cl, z2 = sr*sl*Math.sin(lon);
      var ty2 = y2*ct - z2*st, tz2 = y2*st + z2*ct;
      if(tz2 > 0) continue;

      var Z2 = b.wz + tz2;
      if(Z2 < 0.7) continue;
      var k2 = focal/Z2;
      var sx2 = cx0 + (b.wx + x2)*k2, sy2 = cy0 + (b.wy + ty2)*k2;
      if(sx2 < -40 || sx2 > W+40 || sy2 < -40 || sy2 > H+40) continue;

      var fs2 = GLYPH*k2*1.25;
      if(fs2 > maxFs) fs2 = maxFs;
      if(fs2 < ATLAS_SIZES[0]) continue;

      var a2 = (0.42 + 0.68*(-tz2/sr))*(1 - p.rr*1.1)*vis;
      if(a2 < 0.04) continue;
      if(rnd() < 0.08) p.gi = (rnd()*NG)|0;
      blit(p.rr < 0.26 ? 2 : 1, sizeIdx(fs2), p.gi, sx2, sy2, a2 > 1 ? 1 : a2);
    }
  }

  /* ============================================================
     TITLE CARD — assembles out of the debris after a detonation
