     ============================================================
     The lettering is not drawn as text. The phrase is rendered once
     to an offscreen canvas, its pixels are sampled on a grid, and
     every hit becomes a target for one small glyph. So the words are
     built out of the same falling characters as everything else,
     at a size far below the one the phrase is set in.

     Sampling step is tied to font size rather than fixed, or the
     phrase gets dense and unreadable at small sizes and sparse and
     ragged at large ones.
     ============================================================ */
  var TITLE_TEXT = 'WELCOME TO THE LOG';
  var T_IN = 1.15, T_HOLD = 1.60, T_OUT = 0.95;

  function buildTitle(){
    var c = document.createElement('canvas');
    c.width  = Math.max(560, Math.min(1500, Math.round(W*1.15)));
    c.height = 170;
    var g = c.getContext('2d');

    var size = Math.max(20, Math.min(62, c.width*0.056));
    g.font = size + "px 'Share Tech Mono', monospace";
    while(size > 13 && g.measureText(TITLE_TEXT).width > c.width*0.90){
      size -= 2;
      g.font = size + "px 'Share Tech Mono', monospace";
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#fff';
    g.fillText(TITLE_TEXT, c.width*0.5, c.height*0.5);

    var img;
    try { img = g.getImageData(0, 0, c.width, c.height).data; }
    catch(e){ return null; }

    var step = Math.max(3, Math.round(size/12));
    var sc = W/c.width;                       // map sample space to screen
    var ox = W*0.5, oy = H*0.38;
    var pts = [];
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;

    for(var y=0;y<c.height;y+=step){
      for(var x=0;x<c.width;x+=step){
        if(img[(y*c.width + x)*4 + 3] < 120) continue;
        var tx = ox + (x - c.width*0.5)*sc;
        var ty = oy + (y - c.height*0.5)*sc;
        if(tx < minX) minX = tx;
        if(tx > maxX) maxX = tx;
        if(ty < minY) minY = ty;
        if(ty > maxY) maxY = ty;
        var a  = rnd()*6.283, r = 260 + rnd()*620;
        pts.push({
          tx: tx, ty: ty,
          sx: ox + Math.cos(a)*r, sy: oy + Math.sin(a)*r*0.7,
          ox: Math.cos(a), oy: Math.sin(a),
          gi: (rnd()*NG)|0,
          d:  rnd()*0.35                       // per-glyph arrival stagger
        });
      }
    }
    return {pts:pts, minX:minX, maxX:maxX, minY:minY, maxY:maxY};
  }

  function startTitle(){
    var r = buildTitle();
    if(!r || !r.pts.length) return;
    SYS.title = { on:true, t:0, pts:r.pts, flicked:false,
                  minX:r.minX, maxX:r.maxX, minY:r.minY, maxY:r.maxY };
  }

  function drawTitle(){
    var T = SYS.title;
    if(!T || !T.on) return;
    T.t += 0.016;

    var si = sizeIdx(W < 560 ? 7 : 9);
    var phase, u;

    var reveal = T.t < T_IN ? (T.t/T_IN)
               : (T.t < T_IN + T_HOLD ? 1
               : 1 - (T.t - T_IN - T_HOLD)/T_OUT);
    if(reveal > 0){
      var padX = 46, padY = 34;
      var bw = (T.maxX - T.minX) + padX*2, bh = (T.maxY - T.minY) + padY*2;
      var bcx = (T.minX + T.maxX)*0.5, bcy = (T.minY + T.maxY)*0.5;
      var bg = ctx.createRadialGradient(bcx, bcy, 0, bcx, bcy, bw*0.5);
      bg.addColorStop(0,   'rgba(0,0,0,0.78)');
      bg.addColorStop(0.62,'rgba(0,0,0,0.55)');
      bg.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.globalAlpha = reveal;
      ctx.fillStyle = bg;
      ctx.save();
      ctx.translate(bcx, bcy);
      ctx.scale(1, bh/bw);
      ctx.beginPath(); ctx.arc(0, 0, bw*0.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    if(T.t < T_IN){ phase = 0; }
    else if(T.t < T_IN + T_HOLD){ phase = 1; }
    else {
      phase = 2;
      u = (T.t - T_IN - T_HOLD)/T_OUT;
      if(!T.flicked){ T.flicked = true; SYS.glitch = Math.max(SYS.glitch, 0.9); }
      if(u >= 1){ T.on = false; SYS.title = null; return; }
    }

    for(var i=0;i<T.pts.length;i++){
      var p = T.pts[i], x, y, a;

      if(phase === 0){
        var pu = (T.t/T_IN - p.d)/(1 - p.d);
        if(pu < 0) continue;
        if(pu > 1) pu = 1;
        var e = 1 - Math.pow(1 - pu, 3);       // ease out, so they settle
        x = p.sx + (p.tx - p.sx)*e;
        y = p.sy + (p.ty - p.sy)*e;
        a = e;
      } else if(phase === 1){
        x = p.tx + (rnd()-0.5)*1.2;            // faint shimmer while held
        y = p.ty + (rnd()-0.5)*1.2;
        a = 0.88 + rnd()*0.12;
      } else {
        x = p.tx + p.ox*u*u*190;
        y = p.ty + p.oy*u*u*150;
        a = 1 - u;
      }

      if(a < 0.04) continue;
      if(rnd() < 0.05) p.gi = (rnd()*NG)|0;
      blit(a > 0.55 ? 2 : 1, si, p.gi, x, y, a);
    }
  }

  /* ---------- ORBIT PATHS -------------------------------------------
     The two prime bodies ride one shared circle, half a turn apart, so
     whenever one is swinging into the foreground the other is receding
     into the background. A single shared angle guarantees that: giving
     each its own angle and speed would let them drift into phase and
     end up crowding the same part of the room.

     Each body keeps its OWN amplitudes, though, so the laps differ —
     how wide it swings laterally, how near it comes, how far above or
     below centre it rides. New amplitudes are picked once per lap and
     then eased toward, rather than swapped in, so the path changes
     between laps without ever visibly jumping.
     ---------------------------------------------------------------- */
  var ORB_SP = 0.0030;                 // ~35s for a full turn

  function newOrbTargets(o){
    o.tRx = 5.4 + rnd()*4.6;           // lateral reach
    o.tRz = 2.4 + rnd()*1.9;           // how near / how far it gets
    o.tYb = 0.42 + rnd()*0.70;         // baseline height
    o.tYa = (rnd()-0.5)*2.0;           // sign decides above or below
    o.tYp = rnd()*6.283;
  }

  function initOrb(b){
    var o = { th:0, zc:6.7, Rx:7.4, Rz:3.1, Yb:0.8, Ya:0.4, Yp:0 };
    newOrbTargets(o);
    o.Rx=o.tRx; o.Rz=o.tRz; o.Yb=o.tYb; o.Ya=o.tYa; o.Yp=o.tYp;
    b.orb = o;
  }

  function solveOrb(b, th, ox, oy){
    var o = b.orb;
    // ease toward this lap's targets so nothing snaps mid-flight
    o.Rx += (o.tRx-o.Rx)*0.010; o.Rz += (o.tRz-o.Rz)*0.010;
    o.Yb += (o.tYb-o.Yb)*0.010; o.Ya += (o.tYa-o.Ya)*0.010;
    o.Yp += (o.tYp-o.Yp)*0.006;

    b.wx = ox + o.Rx*Math.sin(th);
    b.wy = oy + o.Yb + o.Ya*Math.sin(th + o.Yp);
    b.wz = o.zc - o.Rz*Math.cos(th);   // th=0 is nearest, th=PI is furthest
    if(b.wz < 2.2) b.wz = 2.2;
    b.vis = true;
  }

  /* ---------- per-frame ---------- */  /* ---------- per-frame ---------- */
  function drawSystem(now, maxFs){
    SYS.t += 0.016;

    // swing the whole system toward the foreground and back
    SYS.z = SYS.zBase - SYS.fgAmp*(0.5 + 0.5*Math.sin(SYS.t*SYS.fgSp));

    var zc = SYS.z + camZ;
    var ox = bxAt(zc), oy = byAt(zc);   // system origin rides the bend
    var i, b;

    updateAmbient();
    updateInfall(SYS.bodies[0], SYS.bodies[2]);

    /* Solve positions parent-first. Bodies are declared with every
       parent ahead of its children, so one forward pass is enough. */
    var prevTh = SYS.orbTh;
    SYS.orbTh += ORB_SP;
    var wrapped = false;
    if(SYS.orbTh >= 6.283185){ SYS.orbTh -= 6.283185; wrapped = true; }

    // each body rerolls its next lap as it reaches the far point, where
    // the lateral term is zero and a change in reach is invisible
    if(!wrapped && prevTh < Math.PI && SYS.orbTh >= Math.PI){
      newOrbTargets(SYS.bodies[0].orb);
    }
    if(wrapped) newOrbTargets(SYS.bodies[1].orb);

    for(i=0;i<SYS.bodies.length;i++){
      b = SYS.bodies[i];

      if(b.prime){
        // half a turn apart: one comes forward as the other falls back
        solveOrb(b, b === SYS.bodies[0] ? SYS.orbTh : SYS.orbTh + Math.PI, ox, oy);
        continue;
      }

      if(b.parent < 0){ b.wx = ox; b.wy = oy; b.wz = SYS.z; continue; }
      var par = SYS.bodies[b.parent];
      b.th += b.orbitSp;
      planeBasis(b.psi, b.eps, SYS.t*0.02, b.ob);
      var c = Math.cos(b.th)*b.orbitR, sn = Math.sin(b.th)*b.orbitR;
      b.wx = par.wx + c*b.ob.ux + sn*b.ob.vx;
      b.wy = par.wy + c*b.ob.uy + sn*b.ob.vy;
      b.wz = par.wz + c*b.ob.uz + sn*b.ob.vz;

      // an extra pull toward the camera for the headline bodies
      if(b.fg) b.wz -= b.fg*(0.5 + 0.5*Math.sin(SYS.t*b.fgSp + b.fgPh));
      if(b.wz < 2.3) b.wz = 2.3;

      // a moon dies with its planet, and leaves the stage with it
      if(par.alive === false) b.alive = false;
      else if(b.kind === 'moon') b.alive = true;
      b.vis = par.vis !== false;

      /* The gas giant is gated on its own long cycle rather than just
         being far away — an orbit alone would bring it past on every
         lap, and it is supposed to be a rarer sight than that. */
      if(b.appear){
        b.pt += 0.016;
        var cyc = b.appear.period;
        var tsec = b.pt % cyc;
        var onSec = b.appear.on*cyc;
        var edge = 3.0;
        var f = tsec > onSec ? 0
              : Math.min(1, Math.min(tsec, onSec - tsec)/edge);
        b.fade = f < 0 ? 0 : f;
        if(b.fade <= 0.02) b.vis = false;
      }
    }

    // ribbons sit behind the bodies
    drawRibbons(now, maxFs);

    drawDisk(SYS.bodies[0], now, maxFs, false);
    drawStrips(SYS.bodies[0], SYS.bodies[2], now, maxFs);

    // painter's order, far to near
    var order = SYS.bodies.slice().sort(function(p,q){ return q.wz - p.wz; });
    for(i=0;i<order.length;i++){
      var ob = order[i];
      if(ob.alive === false || ob.vis === false) continue;
      if(SYS.ev && SYS.ev.on && ob.burst) continue;   // already blown apart
      drawBody(ob, now, maxFs);
    }

    drawDisk(SYS.bodies[0], now, maxFs, true);
    drawShocks(now, maxFs);
    updateEvent(now, maxFs);
    drawTitle();
  }

  function drawBody(b, now, maxFs){
    if(b.wz < 0.9) return;
    var k = focal/b.wz;
    b.k = k;
    var bcx = cx0 + b.wx*k, bcy = cy0 + b.wy*k;
    var br  = b.R*k, br2 = br*br;
    if(bcx < -400 || bcx > W+400 || bcy < -400 || bcy > H+400) return;

    /* The corridor's own depth strands converge on this region, so a
       body needs its background pushed down or it reads as more of the
       same texture. Kept gentle — at full strength it looks like a hole
       punched in the hallway. */
    if(b.halo > 0 && (b.fade === undefined || b.fade > 0.02)){
      var hr = b.R*b.halo*k*1.25;
      if(hr > W*0.40) hr = W*0.40;
      var hg = ctx.createRadialGradient(bcx,bcy,hr*0.18, bcx,bcy,hr);
      hg.addColorStop(0,   'rgba(0,0,0,0.58)');
      hg.addColorStop(0.45,'rgba(0,0,0,0.40)');
      hg.addColorStop(0.75,'rgba(0,0,0,0.19)');
      hg.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.globalAlpha = b.fade === undefined ? 1 : b.fade;
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(bcx,bcy,hr,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    b.spin += b.spinSp;

    if(b.rings){
      b.rho += b.rhoSp;
      planeBasis(b.sets[0].psi, b.sets[0].eps, b.rho, b.sets[0].b);
      planeBasis(b.sets[1].psi, b.sets[1].eps, b.rho, b.sets[1].b);
      projectRings(b, bcx, bcy, br2, maxFs);
      paintRings(b, now, true);          // behind the globe
    }

    if(b.kind === 'gas') drawGas(b, now, maxFs);
    else drawGlobe(b, now, maxFs);

    if(b.kind === 'sun') drawFlares(b, now, maxFs);
    if(b.rings) paintRings(b, now, false); // in front
  }

  function projectRings(b, bcx, bcy, br2, maxFs){
    var ct = Math.cos(b.tilt), st = Math.sin(b.tilt);
    var stride = lodStride(b.R*focal/b.wz*2.4);   // rings span wider than the globe
    for(var i=0;i<b.rings.length;i++){
      var p = b.rings[i];
      p.phi += p.sp;
      if(i % stride){ p.vis = false; continue; }
      p.vis = false;

      var bs = b.sets[p.set].b;
      var cf = Math.cos(p.phi)*p.r, sf = Math.sin(p.phi)*p.r;
      var x = cf*bs.ux + sf*bs.vx;
      var y = cf*bs.uy + sf*bs.vy;
      var z = cf*bs.uz + sf*bs.vz;

      var y2 = y*ct - z*st, z2 = y*st + z*ct;
      var Z = b.wz + z2;
      if(Z < 0.7) continue;
      var k = focal/Z;
      var sx = cx0 + (b.wx + x)*k, sy = cy0 + (b.wy + y2)*k;

      p.behind = z2 > 0;
      if(p.behind){
        var dx = sx-bcx, dy = sy-bcy;
        if(dx*dx + dy*dy < br2) continue;   // hidden by the globe
      }
      if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

      var fs = GLYPH*k;
      if(fs > maxFs) fs = maxFs;
      if(fs < ATLAS_SIZES[0]) continue;

      p.sx = sx; p.sy = sy; p.fs = fs; p.vis = true;
      p.nf = 0.5 - z2/(b.R*5.2);            // 1 near arc, 0 far arc
      if(rnd() < 0.02) p.gi = (rnd()*NG)|0;
    }
  }

  function paintRings(b, now, wantBehind){
    for(var i=0;i<b.rings.length;i++){
      var p = b.rings[i];
      if(!p.vis || p.behind !== wantBehind) continue;
      var tw = 0.55 + 0.45*Math.sin(now*0.004 + p.tw);
      var nf = p.nf < 0 ? 0 : (p.nf > 1 ? 1 : p.nf);
      // flat shading makes near and far arcs identical and kills the volume
      var a = tw*(0.38 + 0.78*nf)*1.45;
      if(a > 1) a = 1;
      if(a < 0.03) continue;
      blit(tw > 0.93 && nf > 0.6 ? 1 : 0, sizeIdx(p.fs), p.gi, p.sx, p.sy, a);
    }
  }

  /* Screen radius decides how much of a body is worth drawing. At the
     far end of the orbit a body is a few dozen pixels across, and its
     full stream count just stacks glyphs on top of each other. */
  function lodStride(br){
    if(br < 16) return 4;
    if(br < 34) return 3;
    if(br < 62) return 2;
    return 1;
  }

  function drawGlobe(b, now, maxFs){
    var ct = Math.cos(b.tilt), st = Math.sin(b.tilt);
    var hot = b.kind === 'sun';
    var gain = hot ? (1.25 + SYS.accrete*0.55) : 0.95;
    var stride = lodStride(b.R*focal/b.wz);

    for(var i=0;i<b.sphere.length;i+=stride){
      var s = b.sphere[i];
      s.lam += s.sp;

      if(s.flash > 0.02) s.flash *= 0.87; else s.flash = 0;
      if(rnd() < (hot ? 0.018 : 0.004)) s.flash = 1;
      if(rnd() < 0.25) s.g[(rnd()*s.g.length)|0] = (rnd()*NG)|0;

      var sinth = Math.sin(s.th), costh = Math.cos(s.th);
      // keep arc spacing even as the bands narrow toward the poles
      var dLam = GLYPH/(b.R*(sinth < 0.28 ? 0.28 : sinth));

      for(var t=0;t<s.len;t++){
        var lam = s.lam - t*dLam + b.spin;
        var x = b.R*sinth*Math.cos(lam);
        var y = b.R*costh;
        var z = b.R*sinth*Math.sin(lam);

        var ty = y*ct - z*st, tz = y*st + z*ct;
        if(tz > 0) continue;                       // far hemisphere

        var Z = b.wz + tz;
        if(Z < 0.7) continue;
        var k = focal/Z;
        var sx = cx0 + (b.wx + x)*k, sy = cy0 + (b.wy + ty)*k;
        if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

        var fs = GLYPH*k;
        if(fs > maxFs) fs = maxFs;
        if(fs < ATLAS_SIZES[0]) continue;

        var face = -tz/b.R;
        var a = (0.30 + 0.70*face)*(1 - t/s.len*0.60)*gain;
        if(a < 0.03) continue;
        if(a > 1) a = 1;

        var gi = s.g[t % s.g.length];
        if(t === 0 || (hot && t < 2)){
          var f = s.flash > 0.12 ? a + s.flash*0.75 : a;
          blit(2, sizeIdx(fs), gi, sx, sy, f > 1 ? 1 : f);
        } else if(t < 2 || hot){
          blit(1, sizeIdx(fs), gi, sx, sy, a*0.92);
        } else {
          blit(0, sizeIdx(fs), gi, sx, sy, a*0.85);
        }
      }
    }
  }

  /* Flares leave the surface along their own outward direction and arc
     sideways as they climb, so they throw in many directions at once
     instead of forming a uniform halo. */
  function drawFlares(b, now, maxFs){
    var ct = Math.cos(b.tilt), st = Math.sin(b.tilt);
    var stride = lodStride(b.R*focal/b.wz*1.8);

    for(var i=0;i<b.flares.length;i+=stride){
      var f = b.flares[i];
      f.ph += f.drift;

      var sinth = Math.sin(f.th), costh = Math.cos(f.th);
      var dx = sinth*Math.cos(f.ph), dy = costh, dz = sinth*Math.sin(f.ph);

      // any unit vector perpendicular to d gives the arc direction
      var tx = -Math.sin(f.ph), ty = 0, tz = Math.cos(f.ph);

      var beat = 0.55 + 0.45*Math.sin(now*f.beatSp + f.beat);
      var reach = b.R*f.reach*beat;
      var step  = reach/f.len;

      for(var s2=0;s2<f.len;s2++){
        var d = s2*step;
        var arc = f.curve*(d*d)/(b.R*2.2);
        var x = dx*(b.R + d) + tx*arc;
        var y = dy*(b.R + d) + ty*arc;
        var z = dz*(b.R + d) + tz*arc;

        var y2 = y*ct - z*st, z2 = y*st + z*ct;
        var Z = b.wz + z2;
        if(Z < 0.7) continue;
        var k = focal/Z;
        var sx = cx0 + (b.wx + x)*k, sy = cy0 + (b.wy + y2)*k;
        if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

        var fs = GLYPH*k;
        if(fs > maxFs) fs = maxFs;
        if(fs < ATLAS_SIZES[0]) continue;

        var a = Math.pow(1 - s2/f.len, 0.7)*beat*0.98;
        if(a < 0.04) continue;
        if(rnd() < 0.10) f.g[s2 % f.g.length] = (rnd()*NG)|0;

        blit(s2 < 4 ? 2 : (s2 < 12 ? 1 : 0), sizeIdx(fs),
             f.g[s2 % f.g.length], sx, sy, a);
      }
    }
  }

  /* ============================================================
     INFALL — a planet spirals in, is stripped, and merges
     ============================================================
     The doomed planet's orbit decays continuously. As its
     surface gap to the sun closes, tidal streams start tearing
     off its sun-facing side and spiral into the star, and the
     planet itself shrinks as it loses mass. When the gap closes
     entirely it merges: the sun flares, expanding shells of
     glyphs radiate outward, and the frame tears with red static.
     After the shells fade the planet reforms at its original
     orbit, so the whole cycle loops.

     Conservation of angular momentum drives the pacing — the
     orbital rate is scaled by (r0/r)^1.5, so the planet visibly
     accelerates as it falls. A linear decay with a fixed orbital
     rate reads as a planet politely gliding inward; the speed-up
     is what makes it look like a death spiral.
     ============================================================ */
  var SHOCK_MAX = 9.5;

  function initInfall(){
    var P = SYS.bodies[2];
    P.orbitR0 = P.orbitR;
    P.orbitSp0 = P.orbitSp;
    P.R0 = P.R;
    SYS.strips  = [];
    SYS.shocks  = [];
    SYS.glitch  = 0;
    SYS.accrete = 0;
    SYS.reformAt = -1;
    SYS.strip = 0;
    SYS.warp = 1;
    SYS.ripple = 0.16;
    SYS.pulses = [];
    SYS.nextPulse = SYS.t + 5;
    SYS.nextFlick = SYS.t + 11;
    buildDisk(1);

    // pool of tidal-stream particles, reused rather than reallocated
    for(var i=0;i<140;i++){
      SYS.strips.push({
        u: rnd(), sp: 0.006 + rnd()*0.010,
        off: (rnd()-0.5)*2.2, twist: (rnd()-0.5)*2.6,
        th: rnd()*6.283, gi:(rnd()*NG)|0, on:false
      });
    }
  }

  /* Accretion disk: material that has been torn off but not yet
     swallowed, orbiting in the star's equatorial plane and spiralling
     in. Inner annuli orbit faster than outer ones, which is what shears
     the disk into visible spiral arms rather than a rigid ring. */
  function buildDisk(d){
    SYS.disk = [];
    var n = Math.round(190*d);
    for(var i=0;i<n;i++){
      SYS.disk.push({
        r: 1.12 + rnd()*2.5,
        phi: rnd()*6.283,
        sp: 0.013 + rnd()*0.026,
        drift: 0.0014 + rnd()*0.0042,
        thick: (rnd()-0.5)*0.10,
        gi: (rnd()*NG)|0,
        tw: rnd()*6.283
      });
    }
  }

  function drawDisk(sun, now, maxFs, front){
    if(SYS.ev && SYS.ev.on) return;
    var inten = SYS.strip;
    if(inten <= 0.02) return;
    var ct = Math.cos(sun.tilt), st = Math.sin(sun.tilt);

    for(var i=0;i<SYS.disk.length;i++){
      var p = SYS.disk[i];
      if(!front){
        p.phi += p.sp*(2.3/p.r);       // shorter orbits run faster
        p.r  -= p.drift*inten;
        if(p.r < 1.03){ p.r = 1.5 + rnd()*2.1; p.phi = rnd()*6.283; }
      }

      var rr = p.r*sun.R;
      var x  = rr*Math.cos(p.phi), z0 = rr*Math.sin(p.phi);
      var y0 = p.thick*rr;
      var y  = y0*ct - z0*st, z = y0*st + z0*ct;

      if((z < 0) !== front) continue;   // back half first, front half last

      var Z = sun.wz + z;
      if(Z < 0.8) continue;
      var k = focal/Z;
      var sx = cx0 + (sun.wx + x)*k, sy = cy0 + (sun.wy + y)*k;
      if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

      var fs = GLYPH*k;
      if(fs > maxFs) fs = maxFs;
      if(fs < ATLAS_SIZES[0]) continue;

      var heat = 1 - (p.r - 1)/2.6;     // hotter as it nears the star
      if(heat < 0) heat = 0;
      var tw = 0.55 + 0.45*Math.sin(now*0.006 + p.tw);
      var a = inten*tw*(0.25 + 0.75*heat)*0.95;
      if(a < 0.04) continue;
      if(rnd() < 0.08) p.gi = (rnd()*NG)|0;

      blit(heat > 0.72 ? 2 : (heat > 0.4 ? 1 : 0), sizeIdx(fs), p.gi, sx, sy, a);
    }
  }

  /* Fires an expanding distortion front from a body, and schedules the
     next one. Also drives the periodic static flicker. */
  function updateAmbient(){
    var i, pu;

    for(i=SYS.pulses.length-1;i>=0;i--){
      pu = SYS.pulses[i];
      pu.r += pu.sp;
      pu.life = 1 - pu.r/pu.max;
      if(pu.life <= 0) SYS.pulses.splice(i,1);
    }

    if(SYS.t > SYS.nextPulse){
      SYS.nextPulse = SYS.t + 6 + rnd()*9;
      var cand = [];
      for(i=0;i<SYS.bodies.length;i++){
        var b = SYS.bodies[i];
        if(b.vis !== false && b.alive !== false && b.R > 0.3) cand.push(b);
      }
      if(cand.length){
        var src = cand[(rnd()*cand.length)|0];
        emitPulse(src.wx, src.wy, src.wz, 0.40 + rnd()*0.45);
        if(rnd() < 0.22) SYS.glitch = Math.max(SYS.glitch, 0.20 + rnd()*0.22);
      }
    }

    if(SYS.t > SYS.nextFlick){
      SYS.nextFlick = SYS.t + 9 + rnd()*13;
      SYS.glitch = Math.max(SYS.glitch, 0.34 + rnd()*0.42);
    }
  }

  function emitPulse(cx, cy, cz, amp){
    SYS.pulses.push({
      cx:cx, cy:cy, cz:cz,
      r: 0.4, sp: 0.075 + rnd()*0.055,
      w: 1.5 + rnd()*1.0,
      amp: amp, max: 15 + rnd()*9, life: 1
    });
  }

  function updateInfall(sun, P){
    // both ease back slowly, so the disturbance keeps spreading after
    // the impact instead of snapping off
    if(SYS.warp > 1) SYS.warp = 1 + (SYS.warp-1)*0.988;
    if(SYS.ripple > 0.22) SYS.ripple = 0.22 + (SYS.ripple-0.22)*0.991;
    if(SYS.glitch > 0) SYS.glitch *= 0.955;
    if(SYS.glitch < 0.01) SYS.glitch = 0;
    if(SYS.accrete > 0) SYS.accrete *= 0.94;

    // planet reforms after the shells have faded
    if(!P.alive){
      if(SYS.reformAt > 0 && SYS.t > SYS.reformAt){
        P.alive = true;
        P.orbitR = P.orbitR0;
        P.orbitSp = P.orbitSp0;
        P.R = P.R0;
        SYS.reformAt = -1;
        SYS.strip = 0;
      }
      return;
    }

    if(SYS.ev && SYS.ev.on) return;
    if(sun.vis === false) return;
    P.orbitR -= 0.00046;

    // angular momentum: the tighter the orbit, the faster it whips round
    P.orbitSp = P.orbitSp0*Math.pow(P.orbitR0/Math.max(P.orbitR, 0.35), 1.5);

    var gap = P.orbitR - (sun.R + P.R);
    SYS.strip = gap > 2.1 ? 0 : (gap < 0 ? 1 : 1 - gap/2.1);

    // it loses mass on the way in
    P.R = P.R0*(1 - 0.45*SYS.strip);

    if(gap <= 0) impact(sun, P);
  }

  function impact(sun, P){
    P.alive = false;
    SYS.reformAt = SYS.t + 10;
    SYS.glitch = 1;
    SYS.accrete = 1;
    SYS.warp = 1.9;
    SYS.ripple = 0.9;
    emitPulse(sun.wx, sun.wy, sun.wz, 1.5);
    emitPulse(sun.wx, sun.wy, sun.wz, 1.0);
    SYS.shocks = [];
    for(var i=0;i<5;i++) emitShock(i, sun.wx, sun.wy, sun.wz);
  }

  function emitShock(delay, cx, cy, cz){
    var n = W < 560 ? 70 : 104;
    var pts = [];
    for(var i=0;i<n;i++){
      // golden-angle spiral gives an even spread over the shell
      pts.push({
        th: Math.acos(2*(i+0.5)/n - 1),
        ph: i*2.399963,
        gi: (rnd()*NG)|0
      });
    }
    SYS.shocks.push({
      cx: cx, cy: cy, cz: cz,
      r: -delay*1.15,                 // staggered so the waves pulse
      sp: 0.075 + rnd()*0.045,
      flat: 0.72 + rnd()*0.5,
      pts: pts
    });
  }

  function drawShocks(now, maxFs){
    for(var i=SYS.shocks.length-1;i>=0;i--){
      var sh = SYS.shocks[i];
      sh.r += sh.sp;
      if(sh.r > SHOCK_MAX){ SYS.shocks.splice(i,1); continue; }
      if(sh.r <= 0) continue;

      var life = 1 - sh.r/SHOCK_MAX;
      var pulse = 0.55 + 0.45*Math.sin(sh.r*3.1 - now*0.013);
      var redMix = SYS.glitch > 0.25;

      for(var j=0;j<sh.pts.length;j++){
        var p = sh.pts[j];
        var sth = Math.sin(p.th);
        var x = sth*Math.cos(p.ph)*sh.r;
        var y = Math.cos(p.th)*sh.r*sh.flat;
        var z = sth*Math.sin(p.ph)*sh.r;

        var Z = sh.cz + z;
        if(Z < 0.8) continue;
        var k = focal/Z;
        var sx = cx0 + (sh.cx + x)*k, sy = cy0 + (sh.cy + y)*k;
        if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

        var fs = GLYPH*k;
        if(fs > maxFs) fs = maxFs;
        if(fs < ATLAS_SIZES[0]) continue;

        var a = life*life*pulse*0.95;
        if(a < 0.04) continue;
        if(rnd() < 0.05) p.gi = (rnd()*NG)|0;

        var tier = (redMix && rnd() < 0.35) ? 3 : (life > 0.6 ? 2 : 1);
        blit(tier, sizeIdx(fs), p.gi, sx, sy, a);
      }
    }
  }

  /* Tidal streams: torn from the planet's sun-facing side, arcing as
     they fall so they wrap into the star rather than falling straight
     down the line joining the two bodies. */
  function drawStrips(sun, P, now, maxFs){
    if(SYS.ev && SYS.ev.on) return;
    if(SYS.strip <= 0.01 || !P.alive) return;

    var dx = sun.wx - P.wx, dy = sun.wy - P.wy, dz = sun.wz - P.wz;
    var dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    dx /= dist; dy /= dist; dz /= dist;

    // a perpendicular pair, to swing the stream sideways as it falls
    var ax, ay, az;
    if(Math.abs(dz) < 0.9){ ax = dy; ay = -dx; az = 0; }
    else { ax = 0; ay = dz; az = -dy; }
    var al = Math.sqrt(ax*ax + ay*ay + az*az) || 1;
    ax /= al; ay /= al; az /= al;
    var bx2 = dy*az - dz*ay, by2 = dz*ax - dx*az, bz2 = dx*ay - dy*ax;

    var active = (SYS.strips.length*SYS.strip)|0;

    for(var i=0;i<active;i++){
      var s = SYS.strips[i];
      // accelerates as it nears the star
      s.u += s.sp*(0.4 + s.u*1.9);
      if(s.u >= 1){
        s.u = 0;
        s.off = (rnd()-0.5)*2.2;
        s.twist = (rnd()-0.5)*7.0;
        s.th = rnd()*6.283;
        SYS.accrete = 1;               // the sun brightens as it feeds
      }

      var u = s.u;
      var travel = dist - sun.R*0.85 - P.R;
      var base = P.R + u*travel;

      // swing sideways, peaking mid-flight, and wind round as it goes
      var swing = Math.sin(u*Math.PI)*s.off*(1 + SYS.strip);
      var ang = s.th + u*s.twist*3.4;
      var ca = Math.cos(ang)*swing, sa = Math.sin(ang)*swing;

      var x = P.wx + dx*base + ax*ca + bx2*sa;
      var y = P.wy + dy*base + ay*ca + by2*sa;
      var z = P.wz + dz*base + az*ca + bz2*sa;

      if(z < 0.8) continue;
      var k = focal/z;
      var sx = cx0 + x*k, sy = cy0 + y*k;
      if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

      var fs = GLYPH*k;
      if(fs > maxFs) fs = maxFs;
      if(fs < ATLAS_SIZES[0]) continue;

      var a = (0.35 + 0.65*u)*SYS.strip*1.25;
      if(a > 1) a = 1;
      if(a < 0.04) continue;
      if(rnd() < 0.12) s.gi = (rnd()*NG)|0;

      blit(u > 0.72 ? 2 : (u > 0.35 ? 1 : 0), sizeIdx(fs), s.gi, sx, sy, a);
    }
  }

  /* Red static, built to match the landing page's headline glitch:
     the same RGB-split palette (#ff0059 / #00fff2) applied to horizontal
     slices, firing in discrete stutters rather than animating smoothly.

     The tear is the canvas drawn back onto itself, offset. Source rects
     are in DEVICE pixels while the context transform makes destination
     rects CSS pixels, so the source y/height are scaled by DPR — without
     that the bands sample the wrong part of the frame on a retina screen.
     ============================================================ */
  var _wrapEl = null, _tearEl = null, _tearOn = false;
  function setTear(on){
    if(on === _tearOn) return;               // only touch the DOM on change
    _tearOn = on;
    if(!_wrapEl) _wrapEl = document.querySelector('.wrap');
    if(!_tearEl) _tearEl = document.getElementById('tearlayer');
    // guarded: a missing overlay must not throw out of the frame loop
    if(_wrapEl && _wrapEl.classList) _wrapEl.classList.toggle('tear', on);
    if(_tearEl && _tearEl.classList){
      _tearEl.classList.toggle('on', on);
      _tearEl.style.opacity = on ? '1' : '0';
    }
  }

  function drawGlitch(now){
    var g = SYS.glitch;
    setTear(g > 0.16);                        // the page itself tears too
    if(g <= 0.01) return;

    // the landing page glitch uses steps(1) — it snaps between states
    // rather than easing, so this fires intermittently on purpose
    if(rnd() > 0.35 + 0.55*g){ ctx.globalAlpha = 1; return; }

    var bands = 1 + (g*4|0);
    for(var i=0;i<bands;i++){
      var y  = rnd()*H;
      var h  = 4 + rnd()*38*g;
      var dx = (rnd()-0.5)*34*g;
      var sy = y*DPR, sh = h*DPR;
      if(sh < 1) continue;

      // displaced ghost of the frame itself
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.26*g;
      ctx.drawImage(cv, 0, sy, cv.width, sh, dx, y, W, h);

      // channel split, alternating sides like the headline's ::before/::after
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = (0.05 + 0.13*rnd())*g;
      ctx.fillStyle = (i & 1) ? 'rgba(0,255,242,1)' : 'rgba(255,0,89,1)';
      ctx.fillRect(dx*0.5, y, W, h);
    }

    ctx.globalCompositeOperation = 'source-over';

    // scattered red noise glyphs
    var n = (8 + g*70)|0;
    var si = sizeIdx(W < 560 ? 12 : 17);
    for(var j=0;j<n;j++){
      blit(3, si, (rnd()*NG)|0, rnd()*W, rnd()*H, (0.15 + rnd()*0.55)*g);
    }
    ctx.globalAlpha = 1;
  }

  function drawRibbons(now, maxFs){
    var nb = SYS.bodies.length;

    for(var r=0;r<SYS.ribbons.length;r++){
      var rib = SYS.ribbons[r];
      for(var i=0;i<rib.pts.length;i++){
        var p = rib.pts[i];
        p.z -= p.sp;
        if(p.z < zNear) p.z = zFar;

        var zc = p.z + camZ;
        var ang = rib.a0 + rib.twist*p.z
                + rib.sw*Math.sin(p.z*rib.f1 + SYS.t*0.55 + rib.ph);
        var rad = rib.r0 + rib.r1*Math.sin(p.z*rib.f2 + SYS.t*0.38);

        var x = bxAt(zc) + rad*Math.cos(ang);
        var y = byAt(zc) + rad*Math.sin(ang)*rib.yk;
        var z = p.z;

        // the shared gravity field does the bending now, so ribbons sag
        // and wind around a mass instead of being shoved off it
        warpPoint(x, y, z);
        x = _w[0]; y = _w[1]; z = _w[2];

        if(z < zNear*0.8) continue;
        var k = focal/z;
        var sx = cx0 + x*k, sy = cy0 + y*k;
        if(sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;

        var fs = GLYPH*k;
        if(fs > maxFs) fs = maxFs;
        if(fs < ATLAS_SIZES[0]) continue;

        var fade = 1 - (z - zNear)/(zFar - zNear);
        if(fade <= 0) continue;
        var tw = 0.5 + 0.5*Math.sin(now*0.005 + p.tw);
        var a = (fade*fade*0.5 + fade*0.5)*(0.30 + 0.70*tw)*0.46;
        if(a < 0.03) continue;

        if(rnd() < 0.03) p.gi = (rnd()*NG)|0;
        blit(tw > 0.9 ? 1 : 0, sizeIdx(fs), p.gi, sx, sy, a);
      }
    }
  }

  build();
  requestAnimationFrame(frame);

  // the small icon beside the title blows the scene apart and rebuilds
  // a new one — kept off the title link itself, which navigates home
  (function(){
    var btn = document.getElementById('btn-detonate');
    if(!btn) return;
    btn.addEventListener('click', function(e){
      e.preventDefault();
      if(SYS.ev && SYS.ev.on) return;
      btn.disabled = true;
      detonate();
    });
  })();

  // rebuild the atlas once the webfont is really available,
  // otherwise every glyph is baked in the fallback monospace
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ buildAtlas(); });
  }

  // iOS Safari fires resize on URL-bar collapse with only a height
  // delta. Rebuilding there would reset every strand mid-fall.
  var lw = window.innerWidth, lh = window.innerHeight, rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      var w = window.innerWidth, vh = window.innerHeight;
      if(w !== lw || Math.abs(vh-lh) > 140){ lw = w; lh = vh; build(); }
    }, 220);
  });
})();

/* ============================================================
   BOOT
   ============================================================ */
$('ed-date').value = today();
refreshAuthUI();
route();

if(cfgPlaceholder()){
  $('auth').classList.add('show');
  fillCfgFields();
  say('auth-status','Set your GitHub username and repository below, then paste a token.','warn');
}

})();
</script>
</body>
